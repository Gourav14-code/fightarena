        const enemyHealth = 70 + Math.min(60, Math.floor(this.distanceMeters / 100) * 15);

        // 2. CRITICAL FIX: Spawn enemy STRICTLY inside visible canvas boundaries
        const enemyX = this.virtualW - 200; // 1080px inside 1280px canvas
        const enemyY = this.groundY - 32;

        this.currentEnemy = new ShinobiRagdoll(this.engine, enemyX, enemyY, false, {
          health: enemyHealth,
          isArmored: isArmored
        }, this);

        this.currentEnemy.enemyAimTimer = 2600 + Math.random() * 600;
        this.currentEnemy.enemyShotCount = 0;
        this.enemies = [this.currentEnemy];

        // 3. Switch immediately to COMBAT state (stops scrolling!)
        this.gameState = 'COMBAT';
        if (this.player && !this.player.isDead) {
          this.player.isWalking = false;
          Matter.Body.setVelocity(this.player.torso, { x: 0, y: 0 });
        }

        this.addPopup(this.virtualW / 2, 230, '⚔️ DUEL COMMENCES! ⚔️', '#ff2a4d', true);
      }

      proceedToNextWave() {
        if (this.waveTransitionTimer) return;

        // FORCE CLEAR any active UI elements, aiming and flying projectiles immediately
        this.isAiming = false;
        if (this.player) this.player.isAiming = false;
        for (let p of this.projectiles) p.destroy();
        this.projectiles = [];

        // 1.5 seconds wait: lets player celebrate victory & enemy ragdoll drop flat
        this.waveTransitionTimer = setTimeout(() => {
          if (this.gameState === 'GAME_OVER') return;

          // FORCE CLEAR AGAIN to ensure 100% clean screen
          this.isAiming = false;
          if (this.player) {
            this.player.isAiming = false;
            this.player.isWalking = true;
          }
          for (let p of this.projectiles) p.destroy();
          this.projectiles = [];

          // Destroy vanquished enemy
          if (this.currentEnemy) {
            this.currentEnemy.destroy();
            this.currentEnemy = null;
            this.enemies = [];
          }

          // Switch gameState back to 'RUNNING'
          this.gameState = 'RUNNING';
          this.runDistanceProgress = 0;
          this.runTargetDistance = 160 + Math.random() * 90;
          this.waveTransitionTimer = null;

          this.addPopup(220, this.groundY - 90, 'ADVANCING...', '#38bdf8', false);
        }, 1500);
      }

      onShurikenHit(shuriken, targetBody, forceHeadshot = false) {
        if (!shuriken || shuriken.isStuck) return;
        const ragdoll = targetBody.ragdollOwner;
        if (!ragdoll || ragdoll.isDead) return;

        if (shuriken.isPlayer && !ragdoll.isPlayer) {
          const isHeadshot = forceHeadshot || targetBody.label === 'enemy_head' || targetBody === ragdoll.head || targetBody.isHead;
          const damage = isHeadshot ? 999 : (targetBody.label === 'enemy_torso' ? 45 : 30);

          const hitVx = shuriken.body.velocity.x * 0.003;
          const hitVy = shuriken.body.velocity.y * 0.003 - 0.01;

          const res = ragdoll.applyHit(damage, targetBody, { x: hitVx, y: hitVy }, isHeadshot);
          shuriken.stickTo(targetBody);

          // Sparks & HP-Scaled Blood
          this.particles.spawnImpactSparks(shuriken.body.position.x, shuriken.body.position.y, isHeadshot ? 38 : 16, isHeadshot);
          const remainingHpPct = Math.max(0, ragdoll.health / ragdoll.maxHealth);
          this.particles.spawnBlood(
            shuriken.body.position.x,
            shuriken.body.position.y,
            shuriken.body.velocity.x,
            shuriken.body.velocity.y,
            remainingHpPct,
            isHeadshot || res.defeated
          );
          this.sounds.playHit(isHeadshot);

          if (isHeadshot) {
            this.headshots++;
            this.goldCoins += 25;
            this.sounds.playCoin();
            this.addPopup(targetBody.position.x, targetBody.position.y - 30, 'CRITICAL / HEADSHOT!', '#fbbf24', true);
            this.addPopup(targetBody.position.x, targetBody.position.y - 58, '+25 COINS', '#f59e0b');
          } else {
            this.addPopup(targetBody.position.x, targetBody.position.y - 25, `-${damage}`, '#f43f5e');
            if (res.defeated) {
              this.goldCoins += 10;
              this.sounds.playCoin();
              this.addPopup(targetBody.position.x, targetBody.position.y - 50, '+10 COINS', '#f59e0b');
            }
          }

          if (res.defeated) {
            this.kills++;
            this.proceedToNextWave();
          }
        }
      }

      handleCollisions(event) {
        const pairs = event.pairs;
        for (let pair of pairs) {
          const bodyA = pair.bodyA;
          const bodyB = pair.bodyB;

          const shurikenBody = bodyA.shurikenRef ? bodyA : (bodyB.shurikenRef ? bodyB : null);
          const targetBody = bodyA === shurikenBody ? bodyB : bodyA;

          if (shurikenBody && targetBody) {
            const shuriken = shurikenBody.shurikenRef;
            if (shuriken.isStuck) continue;

            const ragdoll = targetBody.ragdollOwner;

            // FRIENDLY FIRE PROTECTION: Enemy projectile can NEVER hit an enemy
            if (!shuriken.isPlayer && ragdoll && !ragdoll.isPlayer) {
              continue;
            }

            // Dead ragdolls are sensors and completely ignored
            if (ragdoll && ragdoll.isDead) {
              continue;
            }

            // Player Shuriken hitting Enemy
            if (shuriken.isPlayer && ragdoll && !ragdoll.isPlayer && !ragdoll.isDead) {
              const isHeadshot = targetBody.label === 'enemy_head' || targetBody === ragdoll.head || targetBody.isHead;
              this.onShurikenHit(shuriken, targetBody, isHeadshot);
            }

            // Enemy Shuriken hitting Player (Aimed at torso/body only)
            if (!shuriken.isPlayer && ragdoll && ragdoll.isPlayer && !ragdoll.isDead) {
              const damage = 25; // Balanced body damage

              this.timeSinceLastDamage = 0;
              const hitVx = shurikenBody.velocity.x * 0.003;
              const hitVy = shurikenBody.velocity.y * 0.003 - 0.01;

              ragdoll.applyHit(damage, targetBody, { x: hitVx, y: hitVy }, false);
              shuriken.stickTo(targetBody);

              this.particles.spawnImpactSparks(shurikenBody.position.x, shurikenBody.position.y, 16, false);
              const remainingPlayerHpPct = Math.max(0, ragdoll.health / ragdoll.maxHealth);
              this.particles.spawnBlood(
                shurikenBody.position.x,
                shurikenBody.position.y,
                shurikenBody.velocity.x,
                shurikenBody.velocity.y,
                remainingPlayerHpPct,
                ragdoll.isDead
              );
              this.sounds.playHit(false);
              this.addPopup(targetBody.position.x, targetBody.position.y - 25, `-${damage}`, '#ef4444');

              if (ragdoll.isDead) {
                this.triggerGameOver();
              }
            }

            // Shuriken hitting Ground Platform
            if (targetBody.label === 'platform') {
              if (!shuriken.isStuck && !shuriken.isGroundStuck) {
                shuriken.isGroundStuck = true;
                shuriken.isStuck = true;
                shuriken.groundStuckTimer = 2500;
                Matter.Body.setVelocity(shuriken.body, { x: 0, y: 0 });
                Matter.Body.setAngularVelocity(shuriken.body, 0);
                this.particles.spawnImpactSparks(shurikenBody.position.x, shurikenBody.position.y, 8, false);
              }
            }
          }
        }
      }

      triggerGameOver() {
        if (this.gameState === 'GAME_OVER') return;
        this.gameState = 'GAME_OVER';
        this.sounds.playDefeat();

        if (this.distanceMeters > this.bestDistance) {
          this.bestDistance = Math.floor(this.distanceMeters);
          localStorage.setItem('rooftop_shinobi_best', this.bestDistance.toString());
        }
      }

      addPopup(x, y, text, color = '#ff2a4d', isCrit = false) {
        this.popups.push({
          x: x,
          y: y,
          text: text,
          color: color,
          isCrit: isCrit,
          alpha: 1.0,
          scale: isCrit ? 1.4 : 1.0,
          vy: -1.4
        });
      }

      updateAI(delta) {
        if (this.gameState !== 'COMBAT' || this.waveTransitionTimer || !this.player || this.player.isDead) {
          return;
        }
        if (!this.currentEnemy || this.currentEnemy.isDead || this.currentEnemy.isDestroyed) return;

        const enemy = this.currentEnemy;

        if (!enemy.enemyAimTimer) {
          enemy.enemyAimTimer = 2800 + Math.random() * 800;
        }
        enemy.enemyAimTimer -= delta;

        // Aiming Windup
        const windupStart = 1000;
        const windupEnd = 200;
        if (enemy.enemyAimTimer <= windupStart && enemy.enemyAimTimer > windupEnd) {
          enemy.isAiming = true;
          enemy.aimPullProgress = (windupStart - enemy.enemyAimTimer) / (windupStart - windupEnd);
        } else if (enemy.enemyAimTimer <= windupEnd && enemy.enemyAimTimer > 0) {
          enemy.isAiming = true;
          enemy.aimPullProgress = 1.0;
        } else {
          enemy.isAiming = false;
        }

        if (enemy.enemyAimTimer <= 0) {
          enemy.isAiming = false;

          enemy.enemyShotCount = (enemy.enemyShotCount || 0) + 1;
          const shotCycle = (enemy.enemyShotCount - 1) % 5;
          const isAccurate = (shotCycle === 0);

          const startX = enemy.torso.position.x - 20;
          const startY = enemy.torso.position.y - 10;

          const targetX = this.player.torso.position.x;
          const targetY = this.player.torso.position.y + 35; // Lower torso / body

          const dx = targetX - startX;
          const dy = targetY - startY;

          const gravity = 0.32;
          const flightSteps = 36;

          let vx = dx / flightSteps;
          let vy = (dy - 0.5 * gravity * flightSteps * flightSteps) / flightSteps;

          if (isAccurate) {
            const headX = this.player.head.position.x;
            const headY = this.player.head.position.y;
            let nearHead = false;
            for (let step = 0; step <= flightSteps; step++) {
              const px = startX + vx * step;
              const py = startY + vy * step + 0.5 * gravity * step * step;
              if (Math.hypot(px - headX, py - headY) < 24) {
                nearHead = true;
                break;
              }
            }
            if (nearHead) {
              vy += 0.85;
              vx *= 0.94;
            }
          } else {
            if (shotCycle === 1) {
              vx *= 1.22; vy *= 1.15;
            } else if (shotCycle === 2) {
              vx *= 0.75; vy *= 0.82;
            } else if (shotCycle === 3) {
              vx *= 0.65; vy *= 0.76;
            } else {
              vx *= 0.85; vy -= 1.8;
            }
          }

          const throwAngle = Math.atan2(vy, vx);
          enemy.triggerThrow(throwAngle);

          const shuriken = new Shuriken(this.engine, startX, startY, vx, vy, false, this);
          this.projectiles.push(shuriken);
          this.sounds.playThrow();

          // Reset enemy timer
          enemy.enemyAimTimer = 3200 + Math.random() * 800;
        }
      }

      gameLoop(currentTime) {
        if (!this.lastTime) this.lastTime = currentTime;
        const delta = Math.max(0, Math.min(currentTime - this.lastTime, 40));
        this.lastTime = currentTime;

        // 1. Physics Engine Step
        Matter.Engine.update(this.engine, delta);

        // 2. State Machine: RUNNING vs COMBAT
        if (this.gameState === 'RUNNING') {
          // Automatic scrolling simulation
          this.bgScrollX += this.scrollSpeed * 0.18;

          // Scroll ground tiles left
          for (let tile of this.groundTiles) {
            tile.x -= this.scrollSpeed;
          }

          // Wrap leftmost tiles smoothly to the right edge
          for (let tile of this.groundTiles) {
            if (tile.x + tile.width < -120) {
              let maxRight = -Infinity;
              for (let t of this.groundTiles) {
                if (t.x + t.width > maxRight) maxRight = t.x + t.width;
              }
              tile.x = maxRight;
              const platformPool = ['pagoda', 'rope_bridge', 'torii_gate', 'broken_roof', 'stone_rampart', 'sakura_canopy', 'spike_pit'];
              tile.type = platformPool[Math.floor(Math.random() * platformPool.length)];
            }
          }

          // Accumulate distance meters
          this.distanceMeters += (this.scrollSpeed * delta * 0.005);
          if (this.distanceMeters > this.bestDistance) {
            this.bestDistance = Math.floor(this.distanceMeters);
            localStorage.setItem('rooftop_shinobi_best', this.bestDistance.toString());
          }

          // Check if distance to next duel is reached
          this.runDistanceProgress += this.scrollSpeed;
          if (this.runDistanceProgress >= this.runTargetDistance) {
            this.spawnDuelEnemy();
          }

          // Ensure Player maintains running animation
          if (this.player && !this.player.isDead) {
            this.player.isWalking = true;
          }
        } else if (this.gameState === 'COMBAT') {
          // Scrolling completely stopped!
          if (this.player && !this.player.isDead) {
            this.player.isWalking = false;
          }
          this.updateAI(delta);
        }

        // 3. Stamina Regen & Passive Healing
        if (this.gameState === 'COMBAT' || this.gameState === 'RUNNING') {
          if (!this.isAiming) {
            const staminaGain = (delta / 16.66) * 0.35;
            this.playerStamina = Math.min(this.maxStamina, this.playerStamina + staminaGain);
          }

          this.timeSinceLastDamage += delta;
          if (this.timeSinceLastDamage > 2500 && this.player && !this.player.isDead && this.player.health < this.player.maxHealth) {
            this.player.health = Math.min(this.player.maxHealth, this.player.health + (delta / 1000) * 5.0);
            if (Math.random() < 0.22) {
              this.particles.spawnHealingSparkles(this.player.torso.position.x, this.player.torso.position.y);
            }
          }
        }

        // 4. Update Characters
        if (this.player) {
          if (this.isAiming && !this.waveTransitionTimer && !this.player.isDead) {
            this.player.isAiming = true;
          }
          this.player.update(currentTime, delta);
          if (this.player.torso.position.y > 660 && !this.player.isDead) {
            this.player.health = 0;
            this.player.triggerRagdollDefeat();
            this.triggerGameOver();
          }
        }

        if (this.currentEnemy && !this.currentEnemy.isDestroyed) {
          this.currentEnemy.update(currentTime, delta);
        }

        // 5. Update Projectiles
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          p.update(currentTime, delta);
          if (p.isMarkedForRemoval || p.body.position.y > 800 || p.body.position.x < -200 || p.body.position.x > this.virtualW + 200) {
            p.destroy();
            this.projectiles.splice(i, 1);
          }
        }

        // 6. Update Particles & Popups
        this.particles.update([]);

        for (let i = this.popups.length - 1; i >= 0; i--) {
          const pop = this.popups[i];
          pop.y += pop.vy;
          pop.alpha -= 0.022;
          if (pop.alpha <= 0) {
            this.popups.splice(i, 1);
          }
        }

        // 7. Render Everything
        this.render();

        requestAnimationFrame((t) => this.gameLoop(t));
      }

      render() {
        const ctx = this.ctx;
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        ctx.save();
        ctx.translate(this.offsetX, this.offsetY);
        ctx.scale(this.scaleRatio, this.scaleRatio);

        ctx.beginPath();
        ctx.rect(0, 0, this.virtualW, this.virtualH);
        ctx.clip();

        // 1. Parallax Background
        this.renderBackground(ctx);

        // 2. Continuous Stitched Ground Floor (No Pits)
        this.renderGround(ctx);

        // 3. Characters (Enemy & Player strictly on screen)
        if (this.currentEnemy && !this.currentEnemy.isDestroyed) {
          this.currentEnemy.render(ctx);
        }
        if (this.player) {
          this.player.render(ctx);
        }

        // 4. Projectiles
        for (let p of this.projectiles) p.render(ctx);

        // 5. Ballistic Aim Trajectory Arc (COMBAT only)
        if (this.gameState === 'COMBAT' && this.isAiming && !this.waveTransitionTimer && this.player && !this.player.isDead) {
          this.renderAimTrajectory(ctx);
        }

        // 6. Floating Popups
        for (let pop of this.popups) {
          ctx.save();
          ctx.font = pop.isCrit ? '900 24px "Cinzel", serif' : 'bold 20px "Cinzel", serif';
          ctx.fillStyle = pop.color;
          ctx.globalAlpha = Math.max(0, pop.alpha);
          ctx.shadowColor = pop.color;
          ctx.shadowBlur = 12;
          ctx.textAlign = 'center';
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.restore();
        }

        // 7. World Space Particles
        this.particles.renderWorld(ctx);

        // 8. Foreground Sakura Petals
        this.particles.renderScreen(ctx);

        // 9. Minimalist Shinobi & Duel HUD
        this.renderHUD(ctx);

        // 10. Screen Overlays
        if (this.gameState === 'START') {
          this.renderStartScreen(ctx);
        } else if (this.gameState === 'GAME_OVER') {
          this.renderGameOverScreen(ctx);
        }

        ctx.restore();
      }

      renderBackground(ctx) {
        const bgImg = SpriteAssets.parallaxBgImg;
        if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
          const bgH = this.virtualH;
          const bgScale = bgH / bgImg.naturalHeight;
          const bgW = bgImg.naturalWidth * bgScale;

          const scrollX = this.bgScrollX % bgW;
          let startX = -scrollX;
          while (startX > 0) startX -= bgW;

          for (let drawX = startX; drawX < this.virtualW + bgW; drawX += bgW) {
            ctx.drawImage(bgImg, drawX, 0, bgW, bgH);
          }
        } else {
          // Fallback sky gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, this.virtualH);
          skyGrad.addColorStop(0, '#0a0314');
          skyGrad.addColorStop(0.45, '#1b092b');
          skyGrad.addColorStop(0.85, '#2e1245');
          skyGrad.addColorStop(1, '#180826');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, this.virtualW, this.virtualH);

          const moonX = this.virtualW * 0.76;
          const moonY = 160;
          const moonRadius = 64;

          ctx.fillStyle = '#fef3c7';
          ctx.shadowColor = '#fef08a';
          ctx.shadowBlur = 24;
          ctx.beginPath();
          ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      renderGround(ctx) {
        ctx.save();
        for (let tile of this.groundTiles) {
          const x = tile.x;
          const y = tile.y;
          const w = tile.width;
          const h = tile.height;

          const cfg = PlatformConfigs[tile.type] || PlatformConfigs.pagoda;
          const img = SpriteAssets.getPlatformImage(tile.type);

          if (img && img.complete && img.naturalWidth > 0) {
            const drawH = Math.min(cfg.visualH || 340, Math.max(160, h));
            const capW = cfg.leftCapW || 50;
            const sy = cfg.walkTopSy || 243;
            const sH = Math.min(img.naturalHeight - sy, 420);

            const sliceEdgeW = Math.min(260, Math.floor(img.naturalWidth * 0.18));
            const centerW = img.naturalWidth - sliceEdgeW * 2;

            ctx.drawImage(img, 0, sy - 14, sliceEdgeW, sH, x - capW, y - 4, capW + 8, drawH);
            ctx.drawImage(img, sliceEdgeW, sy, centerW, sH, x, y - 2, w, drawH);
            ctx.drawImage(img, img.naturalWidth - sliceEdgeW, sy - 14, sliceEdgeW, sH, x + w - 8, y - 4, capW + 8, drawH);
          } else {
            ctx.fillStyle = '#14141e';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#ff2a4d';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, w, h);
          }
        }

        // Solid continuous base foundation below platforms to guarantee NO death pits
        ctx.fillStyle = '#08060c';
        ctx.fillRect(-150, this.groundY + 160, this.virtualW + 300, this.virtualH - this.groundY);

        ctx.restore();
      }

      renderAimTrajectory(ctx) {
        const aim = this.getAimLaunchVector();
        if (!aim) return;

        const gravity = 0.32;
        const totalSteps = 28;

        ctx.save();
        for (let t = 0; t < totalSteps; t++) {
          const px = aim.startX + aim.vx * t;
          const py = aim.startY + aim.vy * t + 0.5 * gravity * t * t;

          const dotRadius = Math.max(1.8, 4.5 - t * 0.12);
          const alpha = Math.max(0.15, 1.0 - t * 0.035);

          ctx.beginPath();
          ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
          ctx.fillStyle = this.playerStamina < 25 ? `rgba(245, 158, 11, ${alpha})` : `rgba(255, 42, 77, ${alpha})`;
          ctx.shadowColor = this.playerStamina < 25 ? '#f59e0b' : '#ff2a4d';
          ctx.shadowBlur = 8;
          ctx.fill();
        }
        ctx.restore();
      }

      renderHUD(ctx) {
        ctx.save();
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;

        // 1. Top-Center: Large Distance Display
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.font = '900 36px "Cinzel", serif';
        ctx.shadowColor = 'rgba(255, 42, 77, 0.6)';
        ctx.shadowBlur = 12;
        ctx.fillText(`${Math.floor(this.distanceMeters)} m`, this.virtualW / 2, 48);

        ctx.font = 'bold 14px "Cinzel", serif';
        ctx.fillStyle = '#94a3b8';
        ctx.shadowBlur = 0;
        ctx.fillText(`BEST: ${this.bestDistance} m`, this.virtualW / 2, 72);

        // State Banner (When Running to next fight)
        if (this.gameState === 'RUNNING') {
          const pulse = Math.abs(Math.sin(Date.now() * 0.005));
          ctx.fillStyle = `rgba(56, 189, 248, ${0.7 + pulse * 0.3})`;
          ctx.font = 'bold 16px "Cinzel", serif';
          ctx.fillText('🏃 SPRINTING TO NEXT DUEL...', this.virtualW / 2, 102);
        }

        // 2. Top-Right: Gold Coins Counter
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 22px "Cinzel", serif';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.fillText(`🪙 ${this.goldCoins}`, this.virtualW - 32, 48);

        // 3. Enemy Samurai HP Bar (During COMBAT)
        if (this.gameState === 'COMBAT' && this.currentEnemy && !this.currentEnemy.isDestroyed) {
          const e = this.currentEnemy;
          const maxHp = Number(e.maxHealth || 100);
          const rawHp = e.health !== undefined ? e.health : maxHp;
          const currHp = isNaN(rawHp) ? maxHp : Math.max(0, Math.min(maxHp, rawHp));
          const hpPct = Math.max(0, Math.min(1, currHp / maxHp));

          const barW = 180;
          const barX = this.virtualW - barW - 32;
          const barY = 82;

          // Enemy Card
          ctx.fillStyle = 'rgba(8, 6, 14, 0.82)';
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(barX - 10, 62, barW + 20, 52, 6);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'left';
          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 12px "Cinzel", sans-serif';
          ctx.shadowBlur = 0;
          ctx.fillText(e.isArmored ? 'SAMURAI (ARMORED)' : 'SAMURAI ENEMY', barX, barY - 4);

          ctx.textAlign = 'right';
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(`${Math.ceil(currHp)}/${maxHp}`, barX + barW, barY - 4);

          // Track
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(barX, barY, barW, 10);
          // Fill
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(barX, barY, barW * hpPct, 10);
          // Border
          ctx.strokeStyle = '#b91c1c';
          ctx.lineWidth = 1.2;
          ctx.strokeRect(barX, barY, barW, 10);
        }

        // 4. Top-Left: Player Health & Stamina HUD Card
        if (this.player) {
          const maxHp = Number(this.player.maxHealth || this.player.maxHp || 100);
          const rawHp = this.player.health !== undefined ? this.player.health : (this.player.hp !== undefined ? this.player.hp : maxHp);
          const currHp = isNaN(rawHp) ? maxHp : Math.max(0, Math.min(maxHp, rawHp));
          const hpPct = Math.max(0, Math.min(1, currHp / maxHp));

          const rawStam = this.playerStamina !== undefined ? this.playerStamina : 100;
          const maxStam = Number(this.maxStamina || 100);
          const currStam = isNaN(rawStam) ? maxStam : Math.max(0, Math.min(maxStam, rawStam));
          const stamPct = Math.max(0, Math.min(1, currStam / maxStam));

          const barW = 175;
          const barX = 28;

          ctx.fillStyle = 'rgba(8, 6, 14, 0.82)';
          ctx.strokeStyle = 'rgba(51, 65, 85, 0.75)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(barX - 10, 16, barW + 20, 72, 8);
          ctx.fill();
          ctx.stroke();

          // Health Bar
          const hpBarH = 11;
          const hpBarY = 40;
          const isPassiveHealing = this.timeSinceLastDamage > 2500 && currHp < maxHp && !this.player.isDead;

          ctx.textAlign = 'left';
          ctx.fillStyle = isPassiveHealing ? '#2dd4bf' : '#38bdf8';
          ctx.font = 'bold 12px "Cinzel", "Segoe UI", sans-serif';
          ctx.shadowBlur = 0;
          ctx.fillText(isPassiveHealing ? 'SHINOBI HP (+HEAL)' : 'SHINOBI HP', barX, hpBarY - 6);

          ctx.textAlign = 'right';
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(`${Math.ceil(currHp)}/${maxHp}`, barX + barW, hpBarY - 6);

          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(barX, hpBarY, barW, hpBarH);
          ctx.fillStyle = hpPct > 0.25 ? '#10b981' : '#ef4444';
          ctx.fillRect(barX, hpBarY, barW * hpPct, hpBarH);
          ctx.strokeStyle = isPassiveHealing ? '#2dd4bf' : (hpPct > 0.25 ? '#059669' : '#dc2626');
          ctx.lineWidth = 1.5;
          ctx.strokeRect(barX, hpBarY, barW, hpBarH);

          // Stamina Bar
          const stamBarH = 7;
          const stamBarY = 67;
          const isFatigued = currStam < 25;

          ctx.textAlign = 'left';
          ctx.fillStyle = isFatigued ? '#f59e0b' : '#94a3b8';
          ctx.font = 'bold 11px "Cinzel", "Segoe UI", sans-serif';
          ctx.fillText(isFatigued ? 'STAMINA (FATIGUE)' : 'STAMINA', barX, stamBarY - 4);

          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(barX, stamBarY, barW, stamBarH);
          ctx.fillStyle = isFatigued ? '#f59e0b' : '#38bdf8';
          ctx.fillRect(barX, stamBarY, barW * stamPct, stamBarH);
          ctx.strokeStyle = isFatigued ? '#b45309' : '#0284c7';
          ctx.lineWidth = 1;
          ctx.strokeRect(barX, stamBarY, barW, stamBarH);
        }

        ctx.restore();
      }

      renderStartScreen(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(8, 6, 12, 0.78)';
        ctx.fillRect(0, 0, this.virtualW, this.virtualH);

        ctx.textAlign = 'center';

        ctx.fillStyle = '#f8fafc';
        ctx.font = '900 48px "Cinzel", serif';
        ctx.shadowColor = '#ff2a4d';
        ctx.shadowBlur = 20;
        ctx.fillText('SHADOW SHURIKEN', this.virtualW / 2, this.virtualH / 2 - 70);

        ctx.fillStyle = '#ff2a4d';
        ctx.font = 'bold 24px "Cinzel", serif';
        ctx.shadowBlur = 10;
        ctx.fillText('ROOFTOP SHINOBI', this.virtualW / 2, this.virtualH / 2 - 25);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '16px "Cinzel", serif';
        ctx.shadowBlur = 0;
        ctx.fillText('🏹 DRAG BACKWARD TO AIM & RELEASE SHURIKEN', this.virtualW / 2, this.virtualH / 2 + 35);
        ctx.fillText('💀 HEADSHOTS DEAL INSTANT CRITICAL KO & DOUBLE COINS', this.virtualW / 2, this.virtualH / 2 + 65);

        const pulse = Math.abs(Math.sin(Date.now() * 0.005));
        ctx.fillStyle = `rgba(251, 191, 36, ${0.7 + pulse * 0.3})`;
        ctx.font = 'bold 22px "Cinzel", serif';
        ctx.fillText('— TAP / CLICK TO COMMENCE DUEL —', this.virtualW / 2, this.virtualH / 2 + 130);

        ctx.restore();
      }

      renderGameOverScreen(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(8, 6, 12, 0.88)';
        ctx.fillRect(0, 0, this.virtualW, this.virtualH);

        ctx.textAlign = 'center';

        ctx.fillStyle = '#ef4444';
        ctx.font = '900 50px "Cinzel", serif';
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 24;
        ctx.fillText('SHADOW FALLEN', this.virtualW / 2, this.virtualH / 2 - 110);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 22px "Cinzel", serif';
        ctx.shadowBlur = 0;
        ctx.fillText(`DISTANCE SURVIVED: ${Math.floor(this.distanceMeters)} m`, this.virtualW / 2, this.virtualH / 2 - 40);

        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 18px "Cinzel", serif';
        ctx.fillText(`BEST RECORD: ${this.bestDistance} m`, this.virtualW / 2, this.virtualH / 2 - 10);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '17px "Cinzel", serif';
        ctx.fillText(`Enemies Vanquished: ${this.kills}  |  Critical Headshots: ${this.headshots}  |  Coins: ${this.goldCoins}`, this.virtualW / 2, this.virtualH / 2 + 25);

        const btnW = 220, btnH = 55;
        const btnX = this.virtualW / 2 - btnW / 2;
        const btnY = this.virtualH / 2 + 85;

        ctx.fillStyle = '#ff2a4d';
        ctx.shadowColor = '#ff2a4d';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 8);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 20px "Cinzel", serif';
        ctx.fillText('PLAY AGAIN', this.virtualW / 2, btnY + 35);

        ctx.restore();
      }
    }


    // Launch Game on window load or DOM ready
    function initGame() {
      if (!window.gameInstance) {
        window.gameInstance = new ShadowShurikenGame();
      }
    }
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initGame);
      window.addEventListener('load', initGame);
    } else {
      initGame();
    }

  })();
  </script>
</body>
</html>

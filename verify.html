<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Knockout - Continuous Survival Widescreen Verification</title>
  <style>
    body {
      background: #060a12;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; }
    #test-log {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 16px;
      max-width: 900px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .pass { color: #34d399; font-weight: bold; }
    .fail { color: #f87171; font-weight: bold; }
    .info { color: #94a3b8; }
    #game-container {
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      width: 640px;
      height: 360px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Monster Knockout — Continuous Survival Widescreen Runtime Verification</h1>
  <div id="test-log">Initializing runtime verification harness...<br></div>
  <div id="game-container"></div>

  <script src="assets/phaser.min.js"></script>
  <script src="src/systems/Trajectory.js"></script>
  <script src="src/entities/Projectile.js"></script>
  <script src="src/entities/Arrow.js"></script>
  <script src="src/entities/RagdollCreature.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>

  <script>
    const logEl = document.getElementById('test-log');
    const runtimeErrors = [];

    window.addEventListener('error', (e) => {
      runtimeErrors.push(e.message || String(e));
      const stack = e.error && e.error.stack ? '<pre>' + e.error.stack + '</pre>' : '';
      log(`[CRITICAL ERROR] ${e.message || String(e)} at ${e.filename}:${e.lineno}${stack}`, 'fail');
    });

    function log(msg, status = 'info') {
      const line = document.createElement('div');
      line.className = status;
      line.innerHTML = msg;
      logEl.appendChild(line);
      console.log(msg.replace(/<[^>]*>/g, ''));
    }

    const testResults = [];
    function assert(name, condition, details = '') {
      if (condition) {
        log(`✔ PASS: ${name} ${details ? '— ' + details : ''}`, 'pass');
        testResults.push({ name, passed: true });
      } else {
        log(`✖ FAIL: ${name} ${details ? '— ' + details : ''}`, 'fail');
        testResults.push({ name, passed: false });
      }
    }

    const testConfig = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 1280,
      height: 720,
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      physics: {
        default: 'matter',
        matter: { gravity: { y: 1.25 }, debug: false }
      },
      scene: [BootScene, MenuScene, GameScene, UIScene]
    };

    window.testGame = new Phaser.Game(testConfig);

    let simTime = performance.now();
    function stepLoop(count = 10) {
      for (let i = 0; i < count; i++) {
        simTime += 16.6;
        testGame.step(simTime, 16.6);
      }
    }

    window.addEventListener('load', () => {
      try {
        stepLoop(20);
        runAutomatedTests();
      } catch (err) {
        log(`Error in test suite: ${err.message}<br><pre>${err.stack}</pre>`, 'fail');
      }
    });

    function runAutomatedTests() {
      log('<br><b>1. Engine & Widescreen Desktop Initialization:</b>');
      assert('Phaser 3 Engine Instantiated', typeof Phaser !== 'undefined' && Phaser.VERSION.startsWith('3.'));
      assert('Matter.js Physics Available', typeof Phaser.Physics.Matter !== 'undefined');
      assert('Widescreen 1280x720 Base Resolution Configured', testGame.scale.width === 1280 && testGame.scale.height === 720);

      log('<br><b>2. Procedural Canvas Texture Registry:</b>');
      const tm = testGame.textures;
      const expectedTextures = [
        'creature_gloop', 'creature_gloop_hurt', 'creature_gloop_ko',
        'creature_goblin', 'creature_goblin_hurt', 'creature_goblin_ko',
        'projectile_boulder', 'projectile_puffer', 'projectile_slime', 'projectile_bone',
        'weapon_bow', 'projectile_arrow', 'icon_weapon_slingshot', 'icon_weapon_bow',
        'island_perch', 'trajectory_dot', 'character_shadow',
        'avatar_gloop', 'avatar_goblin'
      ];
      expectedTextures.forEach(t => {
        assert(`Texture "${t}" generated and cached`, tm.exists(t));
      });

      log('<br><b>3. Direct Survival Scene Flow (BootScene -> MenuScene -> GameScene):</b>');
      const sm = testGame.scene;
      assert('MenuScene loaded and active', sm.isActive('MenuScene') || sm.getScene('MenuScene') !== null);

      log('<br><b>4. Arena Transition to GameScene:</b>');
      sm.start('GameScene');
      stepLoop(25);

      const gameScene = sm.getScene('GameScene');
      assert('GameScene is Active', sm.isActive('GameScene'));
      assert('Player Creature (Gloop) Spawned', gameScene && gameScene.playerCreature !== undefined);
      assert('Enemy Creature (Giggle-Goblin) Spawned', gameScene && gameScene.enemyCreature !== undefined);
      assert('Player Perch Island Spawned', gameScene && gameScene.playerPerch !== undefined);
      assert('Enemy Perch Island Spawned', gameScene && gameScene.enemyPerch !== undefined);
      assert('Enemy Creature is Facing Left (flipX=true)', gameScene.enemyCreature && gameScene.enemyCreature.flipX === true);

      // Positioning Check in 1280x720 Widescreen
      const pPos = { x: gameScene.playerCreature.x, y: gameScene.playerCreature.y };
      const ePos = { x: gameScene.enemyCreature.x, y: gameScene.enemyCreature.y };
      assert('Gloop positioned on left island perch', pPos.x > 150 && pPos.x < 300, `x=${Math.round(pPos.x)}, y=${Math.round(pPos.y)}`);
      assert('Goblin positioned on right island perch', ePos.x > 950, `x=${Math.round(ePos.x)}, y=${Math.round(ePos.y)}`);

      log('<br><b>5. Matter.js Physics World Check:</b>');
      const bodies = gameScene.matter.world.getAllBodies();
      assert('Matter.js Physics Bodies Active', bodies.length >= 5, `Active bodies count: ${bodies.length}`);
      const gravY = gameScene.matter.world.engine.gravity.y;
      assert('Gravity active in Matter engine (y=1.25)', gravY === 1.25, `gravity.y = ${gravY}`);

      log('<br><b>6. Continuous Survival HUD & Kill Counter:</b>');
      const uiScene = sm.getScene('UIScene');
      assert('UIScene is Active over GameScene', sm.isActive('UIScene'));
      assert('Kill Counter Text Rendered', uiScene && uiScene.killsText && uiScene.killsText.text.includes('KILLS'));
      assert('Live Timer & Score Info Rendered', uiScene && uiScene.subInfoText && uiScene.subInfoText.text.includes('SCORE'));
      assert('Weapon Tray buttons exist (all 4)', uiScene && uiScene.weaponButtons && Object.keys(uiScene.weaponButtons).length === 4);

      // Weapon switching click simulation
      uiScene.selectWeapon('puffer');
      assert('Weapon switch to "puffer"', uiScene.activeWeapon === 'puffer');
      uiScene.selectWeapon('slime');
      assert('Weapon switch to "slime"', uiScene.activeWeapon === 'slime');
      uiScene.selectWeapon('bone');
      assert('Weapon switch to "bone"', uiScene.activeWeapon === 'bone');
      uiScene.selectWeapon('boulder');
      assert('Weapon switch reverted to "boulder"', uiScene.activeWeapon === 'boulder');

      // Desktop Keyboard shortcuts test (1-4)
      if (uiScene.input && uiScene.input.keyboard) {
        uiScene.input.keyboard.emit('keydown-TWO');
        assert('Keyboard shortcut "2" selects puffer', uiScene.activeWeapon === 'puffer');
        uiScene.input.keyboard.emit('keydown-ONE');
        assert('Keyboard shortcut "1" selects boulder', uiScene.activeWeapon === 'boulder');
      } else {
        assert('Keyboard shortcuts guarded safely', true);
      }

        log('<br><b>7. Milestone 2: Ballistic Aim & Projectile Physics:</b>');
        assert('Trajectory System Instantiated', gameScene.trajectory && typeof gameScene.trajectory.show === 'function');
        gameScene.trajectory.show(gameScene.launchAnchor.x, gameScene.launchAnchor.y, 20, -15);
        const visibleDots = gameScene.trajectory.dots.filter(d => d.visible).length;
        assert('Trajectory Dots Calculated & Rendered', visibleDots > 10, `${visibleDots} dots visible`);
        gameScene.trajectory.hide();
        const hiddenDots = gameScene.trajectory.dots.filter(d => !d.visible).length;
        assert('Trajectory Dots Hidden on Release', hiddenDots === gameScene.trajectory.maxDots);

        // Projectile Launching
        const initialProjCount = gameScene.activeProjectiles.length;
        gameScene.launchProjectile(22, -14);
        stepLoop(5);
        assert('Projectile Spawned into activeProjectiles', gameScene.activeProjectiles.length === initialProjCount + 1);
        const proj = gameScene.activeProjectiles[gameScene.activeProjectiles.length - 1];
        assert('Projectile has Matter Physics Sprite', proj && proj.sprite && proj.sprite.body !== undefined);
        assert('Projectile Mass Configured', proj.config.mass > 0, `mass = ${proj.config.mass}`);
        assert('Projectile Label prefixed', proj.sprite.body.label.startsWith('projectile_'), `label = ${proj.sprite.body.label}`);

        // Combat Hit & Damage Popup Test
        const enemyInitialHP = gameScene.enemyHealth;
        gameScene.handleCombatHit(proj, gameScene.enemyCreature);
        assert('Combat Hit Deducts Enemy HP', gameScene.enemyHealth < enemyInitialHP, `Enemy HP: ${gameScene.enemyHealth}/${gameScene.maxEnemyHealth}`);
        assert('Score Incremented on Impact', gameScene.score > 0, `Score = ${gameScene.score}`);
        assert('UIScene HP Text Updated', uiScene.enemyHealthUI.hpText.text.includes(`${gameScene.enemyHealth}/`));

        // Enemy Defeat & Auto-Respawn Loop Test
        const killsBefore = gameScene.kills;
        gameScene.handleCombatHit(proj, gameScene.enemyCreature); // 23 - 22 = 1
        gameScene.handleCombatHit(proj, gameScene.enemyCreature); // 1 - 22 = 0 (Defeated)
        assert('Enemy Defeat State Triggered', gameScene.isEnemyDefeated === true);
        assert('Kill Counter Incremented', gameScene.kills === killsBefore + 1, `Kills: ${gameScene.kills}`);
        assert('UIScene Kills HUD Updated', uiScene.killsText.text.includes(`KILLS: ${gameScene.kills}`));

        // Step physics to allow delayed call (1200ms) for enemy auto-respawn
        stepLoop(80);
        assert('Seamless Auto-Respawn: New Enemy Active', gameScene.enemyCreature && gameScene.enemyCreature.active === true);
        assert('New Enemy HP Reset to Full', gameScene.enemyHealth === gameScene.maxEnemyHealth, `HP: ${gameScene.enemyHealth}/${gameScene.maxEnemyHealth}`);
        assert('Enemy Defeated Flag Reset', gameScene.isEnemyDefeated === false);

        log('<br><b>8. Weapon Progression — Slingshot & Bow and Arrow:</b>');
        assert('Default Weapon Class is Slingshot', uiScene.activeWeaponClass === 'slingshot');
        assert('Bow initially locked when kills < 3', uiScene.isBowUnlocked === false);

        // Test locked Bow attempt
        uiScene.selectWeaponClass('bow');
        assert('Locked Bow cannot be equipped early', uiScene.activeWeaponClass === 'slingshot');

        // Unlock Bow upon reaching 3 kills
        uiScene.setKills(3);
        assert('Bow & Arrow Unlocked at 3 Kills', uiScene.isBowUnlocked === true);

        // Equip Bow & Arrow
        uiScene.selectWeaponClass('bow');
        assert('Bow & Arrow Equipped Successfully', uiScene.activeWeaponClass === 'bow');
        assert('GameScene detects Bow Active', gameScene.getWeaponClass() === 'bow');

        // Launch Ballistic Flint Arrow
        const projCountBeforeArrow = gameScene.activeProjectiles.length;
        gameScene.launchProjectile(28, -12);
        stepLoop(5);
        assert('Arrow Spawned into activeProjectiles', gameScene.activeProjectiles.length === projCountBeforeArrow + 1);
        const firedArrow = gameScene.activeProjectiles[gameScene.activeProjectiles.length - 1];
        assert('Fired projectile is instance of Arrow', firedArrow instanceof Arrow);
        assert('Arrow has Matter physics body', firedArrow.sprite && firedArrow.sprite.body !== undefined);
        assert('Arrow rotates along flight trajectory', firedArrow.sprite.rotation !== 0);

        // Arrow Sticking & Headshot Collision Test
        const enemyHpBeforeArrow = gameScene.enemyHealth;
        firedArrow.onHit(gameScene.enemy || gameScene.enemyCreature);
        assert('Arrow Sticking Physics Triggered', firedArrow.hasCollided === true);
        assert('Arrow deals piercing damage to Enemy', gameScene.enemyHealth < enemyHpBeforeArrow);

        // Switch back to Slingshot using toggle
        uiScene.toggleWeaponClass();
        assert('Toggled back to Slingshot', uiScene.activeWeaponClass === 'slingshot');

        log('<br><b>9. Articulated Ragdoll Physics & Balance Stabilizer:</b>');
        assert('RagdollCreature instance for Player (Gloop)', gameScene.player instanceof RagdollCreature);
        assert('RagdollCreature instance for Enemy (Goblin)', gameScene.enemy instanceof RagdollCreature);
        assert('Player active balance torque spring active', gameScene.player.kpTorque > 0);
        assert('Enemy active balance torque spring active', gameScene.enemy.kpTorque > 0);

        // Spawn fresh enemy with full HP to test non-lethal hit wobble & hurt expression
        gameScene.spawnEnemyCreature(gameScene.enemyPerchX, gameScene.perchY - 145);
        assert('Creature initially in standing balance state', gameScene.enemy.isRagdoll === false);

        // Test Hit Wobble & Expression Reaction (Non-lethal hit: 10 dmg leaves 35 HP)
        gameScene.enemy.applyHit(10, 5, -2, false);
        const actualTexKey = gameScene.enemy.sprite && gameScene.enemy.sprite.texture ? gameScene.enemy.sprite.texture.key : 'none';
        assert('Hit Reaction: Hurt Expression Texture Triggered', actualTexKey.includes('hurt'), `actual=${actualTexKey}`);

        // Test Knockout Ragdoll Collapse
        gameScene.enemy.knockout({ x: 0.02, y: -0.015 });
        assert('Knockout State Triggered: isRagdoll === true', gameScene.enemy.isRagdoll === true);
        assert('Balance Torque Spring Disconnected on KO', gameScene.enemy.kpTorque === 0);
        assert('Spiral/X KO Eyes Texture Set', gameScene.enemy.sprite.texture.key.includes('ko'));

        log('<br><b>10. Combat Integration — Enemy Counter-Attacks:</b>');
        assert('Enemy Telegraph Visual Graphic exists', gameScene.enemyTelegraph !== undefined);
        const initialPlayerHp = gameScene.playerHealth;
        // Simulate enemy counter attack hit on Gloop
        const enemyCounterNut = new Projectile(gameScene, 240, 380, 'boulder', { x: -10, y: 0 });
        enemyCounterNut.isEnemyProjectile = true;
        gameScene.matter.world.emit('collisionstart', {
          pairs: [{ bodyA: enemyCounterNut.sprite.body, bodyB: gameScene.player.sprite.body }]
        });
        assert('Enemy counter-attack hits player hero', gameScene.playerHealth <= initialPlayerHp);
        assert('Player takes fair initial damage (8-10 dmg)', initialPlayerHp - gameScene.playerHealth <= 12);
        assert('Player HP HUD updated', uiScene.playerHealthUI.hpText.text.includes(`${gameScene.playerHealth}/`));

        log('<br><b>11. Responsive Desktop Scaling Tests:</b>');
        testGame.scale.resize(1920, 1080);
        stepLoop(5);
        assert('Resize to Full HD 1080p (1920x1080)', testGame.scale.width === 1920 && testGame.scale.height === 1080);

        testGame.scale.resize(1280, 720);
        stepLoop(5);
        assert('Revert to Base 720p (1280x720)', testGame.scale.width === 1280 && testGame.scale.height === 720);

        log('<br><b>12. Runtime Error & Missing Asset Audit:</b>');
        assert('Zero unhandled runtime errors', runtimeErrors.length === 0, `Errors: ${runtimeErrors.length}`);

        log('<br><b>--- VERIFICATION COMPLETE ---</b>');
        const passedCount = testResults.filter(r => r.passed).length;
        const totalCount = testResults.length;
        log(`<b>FINAL RESULT: ${passedCount}/${totalCount} tests passed.</b>`, passedCount === totalCount ? 'pass' : 'fail');
        document.body.setAttribute('data-tests-done', 'true');
        document.body.setAttribute('data-tests-passed', passedCount);
        document.body.setAttribute('data-tests-total', totalCount);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shadow Shuriken: Rooftop Shinobi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08060c;
      font-family: 'Cinzel', 'Noto Serif JP', 'Georgia', serif;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #08060c;
    }
    canvas {
      display: block;
      touch-action: none;
      cursor: crosshair;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
  <!-- Matter.js 2D Physics Library (Local with CDN fallback) -->
  <script src="matter.min.js"></script>
  <script>
    if (typeof Matter === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <script>
  (function() {
    'use strict';

    window.addEventListener('error', (e) => {
      console.error('RUNTIME ERROR:', e.message, e.filename, e.lineno);
      const errDiv = document.createElement('div');
      errDiv.id = 'debug-error';
      errDiv.style = 'position:fixed; top:10px; left:10px; color:#ff4444; background:black; padding:10px; z-index:99999; font-size:16px;';
      errDiv.textContent = 'ERR: ' + e.message + ' line ' + e.lineno;
      document.body.appendChild(errDiv);
    });

    // =========================================================================
    // 1. PROCEDURAL SOUND SYNTHESIZER (Web Audio API)
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playThrow() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.18;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2400, now);
        filter.frequency.exponentialRampToValueAtTime(600, now + 0.18);
        filter.Q.setValueAtTime(3.0, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playHit(isHeadshot = false) {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        if (isHeadshot) {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(120, now);
          osc1.frequency.exponentialRampToValueAtTime(35, now + 0.35);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now);
          osc2.frequency.exponentialRampToValueAtTime(520, now + 0.5);

          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.5);
          osc2.stop(now + 0.5);
        } else {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        }
      }
      playDash() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(360, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.35);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
      playCoin() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1560, now);
        osc.frequency.setValueAtTime(2340, now + 0.08);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playDefeat() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.8);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      }
    }

    // =========================================================================
    // 1.5 SPRITE ASSET MANAGER & CHROMA-KEY PROCESSOR
    // =========================================================================
    const SpriteAssets = {
      loaded: false,
      playerSheet: null,
      samuraiSheet: null,
      // Exact frame bounding boxes [sx, sy, sw, sh, anchorX, anchorY]
      // Clamped cleanly above bottom text labels to ensure 100% clean silhouettes
      playerFrames: [
        // 0: IDLE stance (strictly isolated with internal crop margins - ZERO bleed from Frame 1)
        { sx: 120, sy: 215, sw: 495, sh: 740 },
        // 1: AIMING / WINDUP (isolated, no Frame 0 or Frame 2 bleed)
        { sx: 680, sy: 145, sw: 465, sh: 810 },
        // 2: THROW (isolated, arm and weapon clean, no Frame 1 or Frame 3 bleed)
        { sx: 1205, sy: 190, sw: 550, sh: 765 },
        // 3: HURT / HIT (impact stagger, no Frame 2 or Frame 4 bleed)
        { sx: 1760, sy: 190, sw: 445, sh: 768 },
        // 4: SPRINT / LEAP (running / jumping across rooftops, isolated)
        { sx: 2210, sy: 195, sw: 485, sh: 760 }
      ],
      samuraiFrames: [
        // 0: IDLE guard (heavy stance)
        { sx: 10, sy: 160, sw: 720, sh: 775, anchorX: 420, anchorY: 775 },
        // 1: WINDUP CHARGE (charging throw)
        { sx: 710, sy: 160, sw: 720, sh: 775, anchorX: 380, anchorY: 775 },
        // 2: THROW (launching weapon leftward)
        { sx: 1420, sy: 160, sw: 720, sh: 775, anchorX: 370, anchorY: 775 },
        // 3: HURT / HIT (armor sparks & stagger / defeat collapse)
        { sx: 2140, sy: 160, sw: 600, sh: 775, anchorX: 310, anchorY: 775 }
      ],
      loadAndProcess(srcCandidates, isPlayer) {
        return new Promise((resolve) => {
          let index = 0;
          const tryNext = () => {
            if (index >= srcCandidates.length) {
              resolve(null);
              return;
            }
            const src = srcCandidates[index++];
            const img = new Image();
            img.onload = () => {
              try {
                const cv = document.createElement('canvas');
                cv.width = img.width;
                cv.height = img.height;
                const ctx = cv.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, img.width, img.height);
                const d = imgData.data;

                // Erase bottom text caption area cleanly
                const textCutY = isPlayer ? 1000 : 960;
                for (let y = textCutY; y < img.height; y++) {
                  for (let x = 0; x < img.width; x++) {
                    d[(y * img.width + x) * 4 + 3] = 0;
                  }
                }

                // Chroma-key white & off-white background with edge smoothing
                for (let i = 0; i < d.length; i += 4) {
                  if (d[i + 3] === 0) continue;
                  const r = d[i], g = d[i + 1], b = d[i + 2];
                  // Strict background elimination: anything near white or light grey (removes rough white cutting lines/boxes)
                  if (r >= 215 && g >= 215 && b >= 215) {
                    d[i + 3] = 0; // Pure transparent
                  } else if (r > 175 && g > 175 && b > 175) {
                    const avg = (r + g + b) / 3;
                    d[i + 3] = Math.max(0, 255 - (avg - 175) * 6.5); // Soft feathered edge without white fringes
                  }
                }
                ctx.putImageData(imgData, 0, 0);
                resolve(cv);
              } catch (securityErr) {
                // In case of local file:// security restriction, fallback to raw image
                resolve(img);
              }
            };
            img.onerror = () => tryNext();
            img.src = src;
          };
          tryNext();
        });
      },
      init() {
        const playerPaths = [
          'assets/character sprite sheet.png',
          '../assets/character sprite sheet.png',
          '/assets/character sprite sheet.png'
        ];
        const samuraiPaths = [
          'assets/Samurai sprite sheet.png',
          '../assets/Samurai sprite sheet.png',
          '/assets/Samurai sprite sheet.png'
        ];
        Promise.all([
          this.loadAndProcess(playerPaths, true),
          this.loadAndProcess(samuraiPaths, false)
        ]).then(([pCv, sCv]) => {
          if (pCv) this.playerSheet = pCv;
          if (sCv) this.samuraiSheet = sCv;
          if (pCv && sCv) this.loaded = true;
        });
      }
    };
    SpriteAssets.init();

    // =========================================================================
    // 2. MATTER.JS RAGDOLL SHINOBI CREATURE
    // =========================================================================
    class ShinobiRagdoll {
      constructor(engine, x, y, isPlayer = false, options = {}) {
        this.engine = engine;
        this.world = engine.world;
        this.isPlayer = isPlayer;
        this.homeX = x;
        this.homeY = y;
        this.maxHealth = options.maxHealth || options.maxHp || (isPlayer ? 100 : 80);
        this.health = options.health !== undefined ? options.health : (options.hp !== undefined ? options.hp : this.maxHealth);
        this.hp = this.health;
        this.maxHp = this.maxHealth;
        this.isArmored = options.isArmored || false;
        this.isDead = false;
        this.isRagdoll = false;
        this.staggerTimer = 0;
        this.throwAnimTimer = 0;
        this.throwDuration = 200;
        this.throwAngle = 0;
        this.isAiming = false;
        this.aimPullProgress = 0;
        this.isWalking = false;
        this.isJumping = false;
        this.landingTimer = 0;

        // Physics Bodies
        const group = Matter.Body.nextGroup(true);
        this.collisionGroup = group;

        // Head (Dedicated rigid body circle sized to match head/helmet hitbox)
        const headRadius = isPlayer ? 16 : 22;
        const headOffsetY = isPlayer ? 32 : 40;
        this.headRadius = headRadius;
        this.head = Matter.Bodies.circle(x, y - headOffsetY, headRadius, {
          collisionFilter: { group: group, category: 0x0002 },
          density: 0.003,
          friction: 0.8,
          restitution: 0.05,
          label: isPlayer ? 'player_head' : 'enemy_head'
        });
        this.head.ragdollOwner = this;
        this.head.isHead = true;

        // Torso
        this.torso = Matter.Bodies.rectangle(x, y - 5, 22, 36, {
          collisionFilter: { group: group, category: 0x0002 },
          density: 0.003,
          friction: 0.8,
          chamfer: { radius: 5 },
          label: isPlayer ? 'player_torso' : 'enemy_torso'
        });
        this.torso.ragdollOwner = this;

        // Upper Limbs
        this.leftArm = Matter.Bodies.rectangle(x - 12, y - 10, 8, 22, {
          collisionFilter: { group: group, category: 0x0002 },
          density: 0.0015,
          label: isPlayer ? 'player_limb' : 'enemy_limb'
        });
        this.leftArm.ragdollOwner = this;

        this.rightArm = Matter.Bodies.rectangle(x + 12, y - 10, 8, 22, {
          collisionFilter: { group: group, category: 0x0002 },
          density: 0.0015,
          label: isPlayer ? 'player_limb' : 'enemy_limb'
        });
        this.rightArm.ragdollOwner = this;

        // Legs
        this.leftLeg = Matter.Bodies.rectangle(x - 8, y + 24, 10, 26, {
          collisionFilter: { group: group, category: 0x0002 },
          density: 0.002,
          friction: 0.9,
          label: isPlayer ? 'player_limb' : 'enemy_limb'
        });
        this.leftLeg.ragdollOwner = this;

        this.rightLeg = Matter.Bodies.rectangle(x + 8, y + 24, 10, 26, {
          collisionFilter: { group: group, category: 0x0002 },
          density: 0.002,
          friction: 0.9,
          label: isPlayer ? 'player_limb' : 'enemy_limb'
        });
        this.rightLeg.ragdollOwner = this;

        // Constraints
        this.neck = Matter.Constraint.create({
          bodyA: this.torso,
          pointA: { x: 0, y: -18 },
          bodyB: this.head,
          pointB: { x: 0, y: headRadius - 4 },
          stiffness: 0.95,
          damping: 0.1
        });
        this.leftShoulder = Matter.Constraint.create({
          bodyA: this.torso,
          pointA: { x: -10, y: -12 },
          bodyB: this.leftArm,
          pointB: { x: 0, y: -9 },
          stiffness: 0.85,
          damping: 0.1
        });
        this.rightShoulder = Matter.Constraint.create({
          bodyA: this.torso,
          pointA: { x: 10, y: -12 },
          bodyB: this.rightArm,
          pointB: { x: 0, y: -9 },
          stiffness: 0.85,
          damping: 0.1
        });
        this.leftHip = Matter.Constraint.create({
          bodyA: this.torso,
          pointA: { x: -6, y: 16 },
          bodyB: this.leftLeg,
          pointB: { x: 0, y: -11 },
          stiffness: 0.88,
          damping: 0.1
        });
        this.rightHip = Matter.Constraint.create({
          bodyA: this.torso,
          pointA: { x: 6, y: 16 },
          bodyB: this.rightLeg,
          pointB: { x: 0, y: -11 },
          stiffness: 0.88,
          damping: 0.1
        });

        this.constraints = [this.neck, this.leftShoulder, this.rightShoulder, this.leftHip, this.rightHip];

        // Composite container
        this.composite = Matter.Composite.create();
        Matter.Composite.add(this.composite, [
          this.head, this.torso, this.leftArm, this.rightArm, this.leftLeg, this.rightLeg,
          ...this.constraints
        ]);
        Matter.Composite.add(this.world, this.composite);
      }

      get body() {
        return this.torso;
      }

      get hp() {
        return this.health;
      }
      set hp(v) {
        this.health = v;
      }
      get maxHp() {
        return this.maxHealth;
      }
      set maxHp(v) {
        this.maxHealth = v;
      }

      setPosition(x, y) {
        const dx = x - this.torso.position.x;
        const dy = y - this.torso.position.y;
        this.homeX = x;
        this.homeY = y;

        const bodies = [this.torso, this.head, this.leftArm, this.rightArm, this.leftLeg, this.rightLeg];
        for (let b of bodies) {
          Matter.Body.setPosition(b, {
            x: b.position.x + dx,
            y: b.position.y + dy
          });
          Matter.Body.setVelocity(b, { x: 0, y: 0 });
          Matter.Body.setAngularVelocity(b, 0);
        }
      }

      triggerThrow(angle) {
        this.throwAnimTimer = this.throwDuration;
        this.throwAngle = angle;
        this.isAiming = false;
      }

      update(time, delta) {
        if (this.isDead) {
          if (this.collapseTimer === undefined) this.collapseTimer = 0;
          if (this.collapseTimer < 400) {
            this.collapseTimer += delta;
          }
          // Prevent any 360 spinning! Lock angular velocity to 0 and let body settle flat on platform
          Matter.Body.setAngularVelocity(this.torso, 0);
          Matter.Body.setAngularVelocity(this.head, 0);
          Matter.Body.setVelocity(this.torso, { x: 0, y: 0 });
          Matter.Body.setVelocity(this.head, { x: 0, y: 0 });
          return;
        }

        // Active Upright Stance Controller
        if (!this.isRagdoll && !this.isDead) {
          if (this.staggerTimer > 0) {
            this.staggerTimer -= delta;
          } else {
            const isCritical = (this.health / this.maxHealth) < 0.25;
            let targetTorsoAngle = isCritical ? (this.isPlayer ? 0.28 : -0.28) : 0;
            let targetHeadAngle = isCritical ? (this.isPlayer ? 0.35 : -0.35) : 0;
            const breathOffset = isCritical ? Math.sin(Date.now() * 0.008) * 3 : 0;

            if (this.isWalking) {
              targetTorsoAngle = this.isPlayer ? 0.18 : -0.18;
              targetHeadAngle = this.isPlayer ? 0.12 : -0.12;
            } else if (this.isJumping) {
              targetTorsoAngle = this.isPlayer ? 0.24 : -0.24;
              targetHeadAngle = this.isPlayer ? 0.18 : -0.18;
            } else if (this.landingTimer > 0) {
              this.landingTimer -= delta;
              targetTorsoAngle = this.isPlayer ? 0.14 : -0.14;
            }

            // Restorative Upright Angular Torque
            const angleDiff = targetTorsoAngle - this.torso.angle;
            Matter.Body.setAngle(this.torso, this.torso.angle + angleDiff * 0.25);
            Matter.Body.setAngularVelocity(this.torso, this.torso.angularVelocity * 0.5);

            const headDiff = targetHeadAngle - this.head.angle;
            Matter.Body.setAngle(this.head, this.head.angle + headDiff * 0.25);
            Matter.Body.setAngularVelocity(this.head, 0);

            // Grounding & Platform Support (when not jumping)
            if (!this.isJumping) {
              const targetY = (this.homeY - 6) + breathOffset + (this.landingTimer > 0 ? 6 : 0);
              const dy = targetY - this.torso.position.y;
              const dx = this.homeX - this.torso.position.x;
              Matter.Body.setVelocity(this.torso, {
                x: this.torso.velocity.x * 0.75 + (this.isWalking ? 0 : dx * 0.12),
                y: this.torso.velocity.y * 0.75 + dy * 0.12
              });
            }

            // Legs Animation
            if (this.isWalking) {
              const stride = Math.sin(time * 0.016) * 0.42;
              Matter.Body.setAngle(this.leftLeg, stride);
              Matter.Body.setAngle(this.rightLeg, -stride);
            } else if (this.isJumping) {
              Matter.Body.setAngle(this.leftLeg, -0.55);
              Matter.Body.setAngle(this.rightLeg, 0.45);
            } else {
              Matter.Body.setAngle(this.leftLeg, 0);
              Matter.Body.setAngle(this.rightLeg, 0);
            }
            Matter.Body.setAngularVelocity(this.leftLeg, 0);
            Matter.Body.setAngularVelocity(this.rightLeg, 0);
            Matter.Body.setVelocity(this.leftLeg, { x: 0, y: this.torso.velocity.y });
            Matter.Body.setVelocity(this.rightLeg, { x: 0, y: this.torso.velocity.y });

            // Arm Pose Control
            const backArm = this.isPlayer ? this.leftArm : this.rightArm;
            const throwArm = this.isPlayer ? this.rightArm : this.leftArm;

            // 1. Back Arm: natural resting posture
            const backArmRestAngle = this.isPlayer ? 0.12 : -0.12;
            Matter.Body.setAngle(backArm, this.torso.angle + backArmRestAngle);
            Matter.Body.setAngularVelocity(backArm, 0);
            Matter.Body.setVelocity(backArm, this.torso.velocity);

            // 2. Throwing Arm: 2-step throw animation
            if (this.throwAnimTimer > 0) {
              this.throwAnimTimer -= delta;
              const t = Math.max(0, this.throwAnimTimer / this.throwDuration);
              if (t > 0.45) {
                Matter.Body.setAngle(throwArm, this.throwAngle);
              } else {
                const easeT = t / 0.45;
                const idleArmAngle = this.isPlayer ? -0.15 : 0.15;
                Matter.Body.setAngle(throwArm, idleArmAngle + (this.throwAngle - idleArmAngle) * easeT);
              }
            } else if (this.isAiming) {
              const pullPct = Math.min(1.0, this.aimPullProgress || 0);
              const cockAngle = this.isPlayer
                ? (-0.15 - pullPct * 1.45)
                : (0.15 + pullPct * 1.45);
              Matter.Body.setAngle(throwArm, cockAngle);
            } else {
              const idleArmAngle = this.isPlayer ? -0.15 : 0.15;
              Matter.Body.setAngle(throwArm, this.torso.angle + idleArmAngle);
            }
            Matter.Body.setAngularVelocity(throwArm, 0);
            Matter.Body.setVelocity(throwArm, this.torso.velocity);
          }
        }
      }

      applyHit(damage, hitBody, impulseForce = { x: 0, y: 0 }, isHeadshot = false) {
        if (this.isDead) return { defeated: false, isHeadshot: false };
        if (isNaN(damage)) damage = 0;

        if (this.isArmored && !isHeadshot && this.health > 40) {
          damage = Math.floor(damage * 0.5);
        }

        this.health = Math.max(0, this.health - damage);
        this.hp = this.health;
        this.staggerTimer = isHeadshot ? 0 : 300;

        if (hitBody && hitBody.position) {
          Matter.Body.applyForce(hitBody, hitBody.position, impulseForce);
        }

        if (isHeadshot || this.health <= 0) {
          this.health = 0;
          this.hp = 0;
          this.triggerRagdollDefeat(impulseForce);
          return { defeated: true, isHeadshot: isHeadshot };
        }

        Matter.Body.applyForce(this.torso, this.torso.position, {
          x: impulseForce.x * 0.65,
          y: impulseForce.y * 0.65 - 0.015
        });
        return { defeated: false, isHeadshot: false };
      }

      triggerRagdollDefeat(impulse = { x: 0, y: 0 }) {
        this.isDead = true;
        this.isRagdoll = true;
        this.staggerTimer = 0;
        this.isAiming = false;
        this.throwAnimTimer = 0;
        this.collapseTimer = 0;

        // No 360 spin! Immediately stop all angular velocity
        Matter.Body.setAngularVelocity(this.torso, 0);
        Matter.Body.setAngularVelocity(this.head, 0);
        Matter.Body.setVelocity(this.torso, { x: 0, y: 0 });
        Matter.Body.setVelocity(this.head, { x: 0, y: 0 });

        for (let c of this.constraints) {
          c.stiffness = 0.15;
          c.damping = 0.3;
        }
      }

      render(ctx) {
        ctx.save();

        // 2. FIX IMAGE BLUR: Disable image smoothing to ensure crisp, razor-sharp cartoon outlines
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        if (ctx.mozImageSmoothingEnabled !== undefined) ctx.mozImageSmoothingEnabled = false;
        if (ctx.msImageSmoothingEnabled !== undefined) ctx.msImageSmoothingEnabled = false;

        if (this.isPlayer) {
          // ===================================================================
          // PLAYER SHINOBI: 100% 2D SPRITE SHEET WITH 5-FRAME STATE MACHINE
          // ZERO PROCEDURAL / STICKMAN SHAPES - INVISIBLE MATTER.JS HITBOXES
          // ===================================================================
          const sheet = SpriteAssets.playerSheet;
          if (sheet) {
            // 4. ANIMATION STATE MACHINE (5 FRAMES)
            let frameIndex = 0;
            if (this.isDead || this.staggerTimer > 0) {
              frameIndex = 3; // Frame 3 (Hit/Hurt): Taking damage (~300ms) or fallen
            } else if (this.isJumping || this.isWalking) {
              frameIndex = 4; // Frame 4 (Leaping/Sprinting): Moving across gap to next platform
            } else if (this.throwAnimTimer > 0) {
              frameIndex = 2; // Frame 2 (Throwing): On release (~200ms), then return to Frame 0
            } else if (this.isAiming) {
              frameIndex = 1; // Frame 1 (Aiming): While pointer is down and dragging
            } else {
              frameIndex = 0; // Frame 0 (Idle): Default resting stance
            }

            // 3. SPRITE SLICING & ALIGNMENT: Use individual crop margins to eliminate sprite bleeding
            const frames = SpriteAssets.playerFrames;
            const frame = (frames && frames[frameIndex]) ? frames[frameIndex] : { sx: 120, sy: 215, sw: 495, sh: 740 };

            const targetHeight = 116; // Character physics height (~110px-120px, strictly locked aspect ratio)
            const scale = targetHeight / frame.sh;
            const drawW = frame.sw * scale;
            const drawH = targetHeight;

            // Root physics body coordinates
            const posX = this.body.position.x;
            const posY = this.body.position.y;

            if (this.isDead) {
              // Defeat pose: collapse backward onto roof and rest flat
              const t = Math.min(1.0, (this.collapseTimer || 0) / 380);
              const ease = 1 - Math.cos((t * Math.PI) / 2);
              const targetFallAngle = -1.48;
              const currentAngle = targetFallAngle * ease;

              ctx.save();
              ctx.translate(posX, posY + 26);
              ctx.rotate(currentAngle);
              ctx.drawImage(
                sheet,
                frame.sx, frame.sy, frame.sw, frame.sh,
                -drawW / 2, -drawH / 2, drawW, drawH
              );
              ctx.restore();
            } else {
              // Ground contact shadow when alive and on platform
              if (!this.isJumping) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.ellipse(posX, posY + 34, 26, 5.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
              }

              ctx.save();
              // Centered directly over player's root physics body
              ctx.translate(posX, posY - 14);
              // BIND MATTER.JS PHYSICS ANGLE DYNAMICALLY TO THE VISUAL SPRITE!
              ctx.rotate(this.body.angle);
              ctx.drawImage(
                sheet,
                frame.sx, frame.sy, frame.sw, frame.sh,
                -drawW / 2, -drawH / 2, drawW, drawH
              );
              ctx.restore();
            }
          }
        } else {
          // ===================================================================
          // ENEMY SAMURAI RENDERING (Faces LEFT toward player)
          // ===================================================================
          const sheet = SpriteAssets.samuraiSheet;
          const frames = SpriteAssets.samuraiFrames;
          if (sheet && frames) {
            let frameIndex = 0;
            if (this.isDead || this.staggerTimer > 0) {
              frameIndex = 3; // Frame 3: HURT / HIT & ARMOR SPARKS
            } else if (this.throwAnimTimer > 0) {
              frameIndex = 2; // Frame 2: THROW
            } else if (this.isAiming) {
              frameIndex = 1; // Frame 1: WINDUP CHARGE
            } else {
              frameIndex = 0; // Frame 0: IDLE GUARD
            }

            const frame = frames[frameIndex] || frames[0];
            const targetH = 126;
            const scale = targetH / frame.sh;
            const drawW = frame.sw * scale;
            const drawH = frame.sh * scale;

            const posX = this.torso.position.x;
            const footY = this.torso.position.y + 34;

            if (this.isDead) {
              const t = Math.min(1.0, (this.collapseTimer || 0) / 380);
              const ease = 1 - Math.cos((t * Math.PI) / 2);
              const targetFallAngle = 1.48;
              const currentAngle = targetFallAngle * ease;

              ctx.save();
              ctx.translate(posX, footY - 8);
              ctx.scale(-1, 1); // Enemy mirrored horizontally to face LEFT toward player!
              ctx.rotate(currentAngle * -1);
              ctx.drawImage(sheet, frame.sx, frame.sy, frame.sw, frame.sh, -frame.anchorX * scale, -frame.anchorY * scale, drawW, drawH);
              ctx.restore();
            } else {
              if (!this.isJumping) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.ellipse(posX, footY + 1, 26, 5.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
              }

              ctx.save();
              ctx.translate(posX, footY);
              ctx.scale(-1, 1); // Enemy mirrored horizontally to face LEFT toward player at all times!
              ctx.rotate(this.torso.angle * 0.4 * -1);
              ctx.drawImage(sheet, frame.sx, frame.sy, frame.sw, frame.sh, -frame.anchorX * scale, -frame.anchorY * scale, drawW, drawH);
              ctx.restore();
            }
          }
        }

        // Floating Health Bar above alive characters (anchored strictly to torso body position)
        if (!this.isDead && (this.health < this.maxHealth || !this.isPlayer)) {
          const hpBarW = 34;
          const hpBarH = 4;
          const barX = this.torso.position.x - hpBarW / 2;
          const barY = this.torso.position.y - 48;
          const curr = (this.health !== undefined ? this.health : this.hp) || 0;
          const maxH = (this.maxHealth || this.maxHp || 100);
          const pct = Math.max(0, Math.min(1, curr / maxH));

          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(barX - 1, barY - 1, hpBarW + 2, hpBarH + 2);
          ctx.fillStyle = this.isPlayer ? '#10b981' : '#f43f5e';
          ctx.fillRect(barX, barY, hpBarW * pct, hpBarH);
        }

        ctx.restore();
      }

      destroy() {
        const bodies = [this.head, this.torso, this.leftArm, this.rightArm, this.leftLeg, this.rightLeg];
        for (let c of this.constraints) {
          Matter.Composite.remove(this.world, c);
        }
        for (let b of bodies) {
          Matter.Composite.remove(this.world, b);
        }
        Matter.Composite.remove(this.world, this.composite);
      }
    }

    // =========================================================================
    // 3. SHURIKEN PROJECTILE
    // =========================================================================
    class Shuriken {
      constructor(engine, x, y, vx, vy, isPlayer = true, game = null) {
        this.engine = engine;
        this.world = engine.world;
        this.isPlayer = isPlayer;
        this.game = game;
        this.isStuck = false;
        this.stuckTarget = null;
        this.stuckOffset = { x: 0, y: 0 };
        this.stuckAngle = 0;
        this.trail = [];
        this.lifeTime = 0;
        this.radius = 11;

        this.isGroundStuck = false;
        this.groundStuckTimer = 2500;
        this.isMarkedForRemoval = false;

        this.body = Matter.Bodies.circle(x, y, this.radius, {
          density: 0.005,
          friction: 0.2,
          frictionAir: 0.003,
          restitution: 0.2,
          label: isPlayer ? 'shuriken_player' : 'shuriken_enemy'
        });
        this.body.shurikenRef = this;

        Matter.Body.setVelocity(this.body, { x: vx, y: vy });
        Matter.Body.setAngularVelocity(this.body, (vx >= 0 ? 1 : -1) * 0.42);
        Matter.Composite.add(this.world, this.body);
      }

      update(time, delta) {
        this.lifeTime += delta;

        if (this.isGroundStuck) {
          this.groundStuckTimer -= delta;
          if (this.groundStuckTimer <= 0 && !this.isMarkedForRemoval) {
            this.isMarkedForRemoval = true;
            if (this.game && this.game.particles) {
              this.game.particles.spawnDustPuff(this.body.position.x, this.body.position.y, 14);
            }
          }
          return;
        }

        if (this.isStuck && this.stuckTarget && this.stuckTarget.position) {
          const cos = Math.cos(this.stuckTarget.angle);
          const sin = Math.sin(this.stuckTarget.angle);
          const px = this.stuckTarget.position.x + (this.stuckOffset.x * cos - this.stuckOffset.y * sin);
          const py = this.stuckTarget.position.y + (this.stuckOffset.x * sin + this.stuckOffset.y * cos);
          Matter.Body.setPosition(this.body, { x: px, y: py });
          Matter.Body.setAngle(this.body, this.stuckTarget.angle + this.stuckAngle);
          return;
        }

        // Continuous sweep collision check for guaranteed headshot detection
        if (this.isPlayer && !this.isStuck && !this.isGroundStuck && this.game && this.game.enemy && !this.game.enemy.isDead) {
          const enemy = this.game.enemy;
          const headPos = enemy.head.position;
          const curPos = this.body.position;
          const prevPos = this.prevPos || curPos;

          const l2 = (curPos.x - prevPos.x) * (curPos.x - prevPos.x) + (curPos.y - prevPos.y) * (curPos.y - prevPos.y);
          let distToHead;
          if (l2 === 0) {
            distToHead = Math.hypot(headPos.x - curPos.x, headPos.y - curPos.y);
          } else {
            let segT = ((headPos.x - prevPos.x) * (curPos.x - prevPos.x) + (headPos.y - prevPos.y) * (curPos.y - prevPos.y)) / l2;
            segT = Math.max(0, Math.min(1, segT));
            const nearestX = prevPos.x + segT * (curPos.x - prevPos.x);
            const nearestY = prevPos.y + segT * (curPos.y - prevPos.y);
            distToHead = Math.hypot(headPos.x - nearestX, headPos.y - nearestY);
          }

          if (distToHead <= ((enemy.headRadius || 22) + this.radius + 2)) {
            this.game.onShurikenHit(this, enemy.head, true);
            return;
          }
        }
        this.prevPos = { x: this.body.position.x, y: this.body.position.y };

        this.trail.push({
          x: this.body.position.x,
          y: this.body.position.y,
          alpha: 1.0
        });
        if (this.trail.length > 9) this.trail.shift();
      }

      stickTo(targetBody) {
        this.isStuck = true;
        this.stuckTarget = targetBody;
        const cos = Math.cos(-targetBody.angle);
        const sin = Math.sin(-targetBody.angle);
        const dx = this.body.position.x - targetBody.position.x;
        const dy = this.body.position.y - targetBody.position.y;
        this.stuckOffset = {
          x: dx * cos - dy * sin,
          y: dx * sin + dy * cos
        };
        this.stuckAngle = this.body.angle - targetBody.angle;
        this.body.isSensor = true;
        Matter.Body.setVelocity(this.body, { x: 0, y: 0 });
        Matter.Body.setAngularVelocity(this.body, 0);
      }

      render(ctx) {
        let fadeAlpha = 1.0;
        if (this.isGroundStuck && this.groundStuckTimer < 600) {
          fadeAlpha = Math.max(0, this.groundStuckTimer / 600);
        }

        ctx.save();
        ctx.globalAlpha = fadeAlpha;

        // Glowing motion trail
        if (this.trail.length > 1 && !this.isStuck) {
          ctx.save();
          for (let i = 0; i < this.trail.length - 1; i++) {
            const p1 = this.trail[i];
            const p2 = this.trail[i + 1];
            const pct = i / this.trail.length;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = this.isPlayer ? `rgba(255, 42, 77, ${pct * 0.7})` : `rgba(168, 85, 247, ${pct * 0.7})`;
            ctx.lineWidth = pct * 5.0;
            ctx.lineCap = 'round';
            ctx.stroke();
          }
          ctx.restore();
        }

        // Draw 4-point iron shuriken
        ctx.save();
        ctx.translate(this.body.position.x, this.body.position.y);
        ctx.rotate(this.body.angle);

        const r = this.radius;
        const coreR = r * 0.32;

        ctx.shadowColor = this.isPlayer ? '#ff2a4d' : '#a855f7';
        ctx.shadowBlur = 10;

        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const angle = (i * Math.PI) / 2;
          const midAngle = angle + Math.PI / 4;

          const tipX = Math.cos(angle) * r;
          const tipY = Math.sin(angle) * r;

          const innerX = Math.cos(midAngle) * coreR;
          const innerY = Math.sin(midAngle) * coreR;

          if (i === 0) ctx.moveTo(tipX, tipY);
          else ctx.lineTo(tipX, tipY);
          ctx.lineTo(innerX, innerY);
        }
        ctx.closePath();

        ctx.fillStyle = '#1e1b29';
        ctx.fill();

        ctx.strokeStyle = this.isPlayer ? '#ff2a4d' : '#c084fc';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24';
        ctx.fill();

        ctx.restore();
        ctx.restore();
      }

      destroy() {
        Matter.Composite.remove(this.world, this.body);
      }
    }

    // =========================================================================
    // 4. PROCEDURAL JAPANESE ROOFTOP PLATFORM
    // =========================================================================
    class RooftopPlatform {
      constructor(engine, x, y, width, height) {
        this.engine = engine;
        this.world = engine.world;
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;

        this.body = Matter.Bodies.rectangle(x + width / 2, y + height / 2, width, height, {
          isStatic: true,
          friction: 0.9,
          label: 'platform'
        });
        Matter.Composite.add(this.world, this.body);

        this.lanterns = [];
        if (width > 180) {
          this.lanterns.push({
            x: x + 24,
            y: y + 8,
            swingAngle: Math.random() * Math.PI
          });
          this.lanterns.push({
            x: x + width - 24,
            y: y + 8,
            swingAngle: Math.random() * Math.PI + 1
          });
        }
      }

      render(ctx) {
        ctx.save();
        const x = this.x;
        const y = this.y;
        const w = this.width;
        const h = this.height;

        ctx.fillStyle = '#0e0e14';
        ctx.strokeStyle = '#222230';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(x - 20, y - 6);
        ctx.quadraticCurveTo(x + w * 0.25, y - 2, x + w * 0.5, y - 4);
        ctx.quadraticCurveTo(x + w * 0.75, y - 2, x + w + 20, y - 6);
        ctx.lineTo(x + w + 16, y + 14);
        ctx.lineTo(x + w - 10, y + 18);
        ctx.lineTo(x + 10, y + 18);
        ctx.lineTo(x - 16, y + 14);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = '#991b1b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x - 12, y + 15);
        ctx.lineTo(x + w + 12, y + 15);
        ctx.stroke();

        ctx.fillStyle = '#09080e';
        ctx.fillRect(x + 10, y + 18, w - 20, h - 18);

        ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
        const winCols = Math.floor((w - 40) / 35);
        for (let i = 0; i < winCols; i++) {
          const wx = x + 25 + i * 35;
          ctx.fillRect(wx, y + 36, 18, 28);
          ctx.strokeStyle = '#09080e';
          ctx.lineWidth = 2;
          ctx.strokeRect(wx, y + 36, 18, 28);
          ctx.beginPath();
          ctx.moveTo(wx + 9, y + 36); ctx.lineTo(wx + 9, y + 64);
          ctx.moveTo(wx, y + 50); ctx.lineTo(wx + 18, y + 50);
          ctx.stroke();
        }

        const now = Date.now() * 0.003;
        for (let l of this.lanterns) {
          const swing = Math.sin(now + l.swingAngle) * 0.12;
          ctx.save();
          ctx.translate(l.x, l.y);
          ctx.rotate(swing);

          ctx.strokeStyle = '#374151';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(0, 16);
          ctx.stroke();

          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 14;
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-7, 16, 14, 20);

          ctx.fillStyle = '#78350f';
          ctx.fillRect(-8, 14, 16, 3);
          ctx.fillRect(-8, 35, 16, 3);

          ctx.fillStyle = '#451a03';
          ctx.fillRect(-3, 22, 6, 8);

          ctx.restore();
        }

        ctx.restore();
      }

      destroy() {
        Matter.Composite.remove(this.world, this.body);
      }
    }

    // =========================================================================
    // 5. ATMOSPHERIC & COMBAT PARTICLE SYSTEMS
    // =========================================================================
    class ParticleManager {
      constructor(canvasWidth, canvasHeight) {
        this.width = canvasWidth;
        this.height = canvasHeight;
        this.petals = [];
        this.sparks = [];
        this.dustPuffs = [];
        this.healSparkles = [];
        this.bloodDroplets = [];
        this.bloodSplats = [];

        for (let i = 0; i < 45; i++) {
          this.petals.push({
            x: Math.random() * canvasWidth,
            y: Math.random() * canvasHeight,
            speedX: -0.8 - Math.random() * 1.4,
            speedY: 0.6 + Math.random() * 1.0,
            angle: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.04,
            size: 5 + Math.random() * 4,
            opacity: 0.4 + Math.random() * 0.5
          });
        }
      }

      resize(w, h) {
        this.width = w;
        this.height = h;
      }

      spawnBlood(x, y, vx, vy, hpPct, isFatalOrHeadshot) {
        let count;
        if (isFatalOrHeadshot) {
          count = 28 + Math.floor(Math.random() * 14);
        } else if (hpPct < 0.30) {
          count = 18 + Math.floor(Math.random() * 9);
        } else {
          count = 6 + Math.floor(Math.random() * 4);
        }

        const baseAngle = Math.atan2(vy, vx);
        const bloodColors = ['#e11d48', '#be123c', '#9f1239', '#881337', '#b91c1c'];

        for (let i = 0; i < count; i++) {
          const spread = (Math.random() - 0.5) * 1.5;
          const angle = baseAngle + spread;
          const speed = 1.8 + Math.random() * (isFatalOrHeadshot ? 8.5 : 5.5);

          this.bloodDroplets.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - (1.2 + Math.random() * 2.2),
            radius: 1.4 + Math.random() * (isFatalOrHeadshot ? 2.4 : 1.6),
            color: bloodColors[Math.floor(Math.random() * bloodColors.length)],
            alpha: 1.0,
            decay: 0.012 + Math.random() * 0.008
          });
        }
      }

      spawnImpactSparks(x, y, count = 16, isCrit = false) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * (isCrit ? 9 : 6);
          this.sparks.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            color: isCrit ? '#fbbf24' : '#ff2a4d',
            size: isCrit ? 3.5 : 2.5,
            alpha: 1.0,
            decay: 0.025 + Math.random() * 0.035
          });
        }
      }

      spawnDustPuff(x, y, count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 1.8;
          this.dustPuffs.push({
            x: x + (Math.random() * 8 - 4),
            y: y + (Math.random() * 6 - 3),
            vx: Math.cos(angle) * speed,
            vy: -0.6 - Math.random() * 1.2,
            radius: 4 + Math.random() * 6,
            maxRadius: 12 + Math.random() * 8,
            alpha: 0.75,
            decay: 0.02 + Math.random() * 0.015,
            color: Math.random() > 0.5 ? 'rgba(148, 163, 184, ' : 'rgba(100, 116, 139, '
          });
        }
      }

      spawnHealingSparkles(x, y) {
        for (let i = 0; i < 3; i++) {
          this.healSparkles.push({
            x: x + (Math.random() * 26 - 13),
            y: y + (Math.random() * 20 - 10),
            vy: -1.2 - Math.random() * 0.8,
            radius: 2.5 + Math.random() * 2,
            alpha: 0.9,
            decay: 0.03
          });
        }
      }

      update(platforms = []) {
        for (let p of this.petals) {
          p.x += p.speedX + Math.sin(Date.now() * 0.002 + p.y * 0.01) * 0.5;
          p.y += p.speedY;
          p.angle += p.rotSpeed;
          if (p.x < -20) p.x = this.width + 20;
          if (p.y > this.height + 20) {
            p.y = -20;
            p.x = Math.random() * this.width;
          }
        }
        for (let i = this.sparks.length - 1; i >= 0; i--) {
          const s = this.sparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.15;
          s.alpha -= s.decay;
          if (s.alpha <= 0) {
            this.sparks.splice(i, 1);
          }
        }
        for (let i = this.dustPuffs.length - 1; i >= 0; i--) {
          const d = this.dustPuffs[i];
          d.x += d.vx;
          d.y += d.vy;
          d.radius += 0.35;
          d.alpha -= d.decay;
          if (d.alpha <= 0) {
            this.dustPuffs.splice(i, 1);
          }
        }
        for (let i = this.healSparkles.length - 1; i >= 0; i--) {
          const h = this.healSparkles[i];
          h.y += h.vy;
          h.alpha -= h.decay;
          if (h.alpha <= 0) {
            this.healSparkles.splice(i, 1);
          }
        }
        for (let i = this.bloodDroplets.length - 1; i >= 0; i--) {
          const b = this.bloodDroplets[i];
          b.x += b.vx;
          b.y += b.vy;
          b.vy += 0.28;
          b.vx *= 0.98;

          let splatted = false;
          if (platforms && b.vy > 0) {
            for (let p of platforms) {
              if (b.x >= p.x - 5 && b.x <= p.x + p.width + 5 && b.y >= p.y - 4 && b.y <= p.y + 16) {
                this.bloodSplats.push({
                  x: b.x,
                  y: p.y + (Math.random() * 2),
                  rx: b.radius * (1.8 + Math.random() * 1.4),
                  ry: b.radius * (0.6 + Math.random() * 0.4),
                  color: b.color,
                  alpha: 0.85,
                  decay: 0.0022
                });
                splatted = true;
                break;
              }
            }
          }

          if (splatted || b.y > 850) {
            this.bloodDroplets.splice(i, 1);
          }
        }
        for (let i = this.bloodSplats.length - 1; i >= 0; i--) {
          const s = this.bloodSplats[i];
          s.alpha -= s.decay;
          if (s.alpha <= 0) {
            this.bloodSplats.splice(i, 1);
          }
        }
      }

      renderWorld(ctx) {
        for (let s of this.bloodSplats) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, s.alpha);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        for (let b of this.bloodDroplets) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, b.alpha);
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        for (let s of this.sparks) {
          ctx.save();
          ctx.fillStyle = s.color;
          ctx.globalAlpha = Math.max(0, s.alpha);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        for (let d of this.dustPuffs) {
          ctx.save();
          ctx.fillStyle = d.color + Math.max(0, d.alpha) + ')';
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        for (let h of this.healSparkles) {
          ctx.save();
          ctx.fillStyle = '#22c55e';
          ctx.shadowColor = '#4ade80';
          ctx.shadowBlur = 8;
          ctx.globalAlpha = Math.max(0, h.alpha);
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      renderScreen(ctx) {
        ctx.save();
        for (let p of this.petals) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = `rgba(255, 138, 174, ${p.opacity})`;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      render(ctx) {
        this.renderScreen(ctx);
      }
    }

    // =========================================================================
    // 6. MAIN GAME CONTROLLER & SCENE MANAGEMENT
    // =========================================================================
    class ShadowShurikenGame {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');

        this.virtualW = 1280;
        this.virtualH = 720;
        this.scaleRatio = 1;
        this.offsetX = 0;
        this.offsetY = 0;

        // Sound System
        this.sounds = new SoundEngine();

        // Game States: 'START', 'PLAYING', 'GAME_OVER'
        this.gameState = 'START';

        // Progression Tracking
        this.distanceMeters = 0;
        this.bestDistance = parseInt(localStorage.getItem('rooftop_shinobi_best') || '0', 10);
        this.goldCoins = 0;
        this.kills = 0;
        this.headshots = 0;

        // Stamina, Fatigue & Passive Healing
        this.playerStamina = 100;
        this.maxStamina = 100;
        this.timeSinceLastDamage = 9999;

        // Camera scroll
        this.cameraX = 0;

        // Input & Drag-to-Aim
        this.isAiming = false;
        this.pointerStart = { x: 0, y: 0 };
        this.pointerCurrent = { x: 0, y: 0 };
        this.maxPullDistance = 140;

        // Floating Text Popups
        this.popups = [];

        // Setup Physics World
        this.initPhysics();

        // Entities: Strictly 1 Player, strictly 1 Enemy, exactly 2 Platforms
        this.player = null;
        this.enemy = null;
        this.leftPlatform = null;
        this.rightPlatform = null;
        this.platforms = [];
        this.enemies = [];
        this.projectiles = [];

        // Transition Loop Controllers
        this.isTransitioning = false;
        this.transitionPhase = 'NONE'; // 'NONE' | 'JUMP' | 'PAN'
        this.transitionTimer = 0;
        this.jumpDuration = 680;
        this.jumpStartX = 0;
        this.jumpStartY = 0;
        this.jumpTargetX = 0;
        this.jumpTargetY = 0;
        this.panDuration = 550;
        this.panStartCamX = 0;
        this.panTargetCamX = 0;

        // Particles
        this.particles = new ParticleManager(this.virtualW, this.virtualH);

        // Bind Window Events
        this.setupEvents();
        this.resize();

        // Check URL preview param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('play') === '1' || urlParams.get('preview') === '1') {
          this.startNewGame();
          if (urlParams.get('aim') === '1') {
            this.isAiming = true;
            this.pointerStart = { x: 300, y: 420 };
            this.pointerCurrent = { x: 210, y: 490 };
            if (this.player) this.player.isAiming = true;
          }
          if (urlParams.get('fatigue') === '1') {
            this.playerStamina = 15;
          }
          if (urlParams.get('lowhp') === '1' && this.player) {
            this.player.health = 20;
          }
        }

        // Enemy AI (1-out-of-5 accuracy rule: 80% deliberate misses)
        this.enemyAimTimer = 0;
        this.enemyShotCount = 0;

        // Start Loop
        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.gameLoop(t));
      }

      getAimLaunchVector() {
        if (!this.player || this.player.isDead) return null;
        const dx = this.pointerStart.x - this.pointerCurrent.x;
        const dy = this.pointerStart.y - this.pointerCurrent.y;
        const pullDist = Math.sqrt(dx * dx + dy * dy);
        if (pullDist < 12) return null;

        const pullClamped = Math.min(pullDist, this.maxPullDistance);
        const baseAngle = Math.atan2(dy, dx);

        let fatiguePowerScale = 1.0;
        let fatigueWobbleAngle = 0;
        if (this.playerStamina < 25) {
          const fatPct = (25 - this.playerStamina) / 25;
          fatiguePowerScale = 1.0 - fatPct * 0.35;
          fatigueWobbleAngle = Math.sin(Date.now() * 0.035) * fatPct * 0.10;
        }

        const angle = baseAngle + fatigueWobbleAngle;
        const power = pullClamped * 0.22 * fatiguePowerScale;

        const vx = Math.cos(angle) * power;
        const vy = Math.sin(angle) * power;

        const startX = this.player.torso.position.x + 18;
        const startY = this.player.torso.position.y - 12;

        return { startX, startY, vx, vy, pullDist, fatiguePowerScale };
      }

      initPhysics() {
        this.engine = Matter.Engine.create({
          enableSleeping: false
        });
        this.engine.gravity.y = 1.05;
        Matter.Events.on(this.engine, 'collisionStart', (e) => this.handleCollisions(e));
      }

      setupEvents() {
        window.addEventListener('resize', () => this.resize());

        const onDown = (e) => {
          this.sounds.init();
          const pos = this.getCanvasPointerPos(e);

          if (this.gameState === 'START') {
            this.startNewGame();
            return;
          }

          if (this.gameState === 'GAME_OVER') {
            const btnW = 220, btnH = 55;
            const btnX = this.virtualW / 2 - btnW / 2;
            const btnY = this.virtualH / 2 + 85;
            if (pos.x >= btnX && pos.x <= btnX + btnW && pos.y >= btnY && pos.y <= btnY + btnH) {
              this.startNewGame();
            }
            return;
          }

          if (this.isTransitioning) return;

          if (this.gameState === 'PLAYING' && this.player && !this.player.isDead) {
            this.isAiming = true;
            this.pointerStart = { x: pos.x, y: pos.y };
            this.pointerCurrent = { x: pos.x, y: pos.y };
            this.player.isAiming = true;
            this.player.aimPullProgress = 0;
            this.player.aimAngle = 0;
          }
        };

        const onMove = (e) => {
          if (!this.isAiming || this.isTransitioning) return;
          this.pointerCurrent = this.getCanvasPointerPos(e);
          if (this.player && !this.player.isDead) {
            const dx = this.pointerStart.x - this.pointerCurrent.x;
            const dy = this.pointerStart.y - this.pointerCurrent.y;
            const pullDist = Math.sqrt(dx * dx + dy * dy);
            this.player.isAiming = true;
            this.player.aimPullProgress = Math.min(1.0, pullDist / this.maxPullDistance);
            this.player.aimAngle = Math.atan2(dy, dx);
          }
        };

        const onUp = (e) => {
          if (!this.isAiming) return;
          this.isAiming = false;
          if (this.player) {
            this.player.isAiming = false;
          }
          if (this.isTransitioning) return;

          const aim = this.getAimLaunchVector();
          if (aim && this.player && !this.player.isDead) {
            const shuriken = new Shuriken(this.engine, aim.startX, aim.startY, aim.vx, aim.vy, true, this);
            this.projectiles.push(shuriken);
            this.sounds.playThrow();

            const launchAngle = Math.atan2(aim.vy, aim.vx);
            this.player.triggerThrow(launchAngle);

            this.playerStamina = Math.max(0, this.playerStamina - 28);
          }
        };

        this.canvas.addEventListener('pointerdown', onDown);
        this.canvas.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      }

      getCanvasPointerPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

        const x = (clientX - rect.left - this.offsetX) / this.scaleRatio;
        const y = (clientY - rect.top - this.offsetY) / this.scaleRatio;
        return { x, y };
      }

      resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        this.canvas.width = w;
        this.canvas.height = h;

        const targetRatio = this.virtualW / this.virtualH;
        const currentRatio = w / h;

        if (currentRatio > targetRatio) {
          this.scaleRatio = h / this.virtualH;
          this.offsetX = (w - this.virtualW * this.scaleRatio) / 2;
          this.offsetY = 0;
        } else {
          this.scaleRatio = w / this.virtualW;
          this.offsetX = 0;
          this.offsetY = (h - this.virtualH * this.scaleRatio) / 2;
        }

        if (this.particles) {
          this.particles.resize(this.virtualW, this.virtualH);
        }
      }

      startNewGame() {
        if (this.player) this.player.destroy();
        if (this.enemy) this.enemy.destroy();
        for (let p of this.platforms) p.destroy();
        for (let s of this.projectiles) s.destroy();

        this.player = null;
        this.enemy = null;
        this.enemies = [];
        this.platforms = [];
        this.projectiles = [];
        this.popups = [];

        this.isTransitioning = false;
        this.transitionPhase = 'NONE';
        this.playerStamina = 100;
        this.maxStamina = 100;
        this.timeSinceLastDamage = 9999;
        this.distanceMeters = 0;
        this.goldCoins = 0;
        this.kills = 0;
        this.headshots = 0;
        this.cameraX = 0;
        this.enemyShotCount = 0;

        // Platform 1: Left Platform (Player Rooftop)
        const playerPlatformW = 280;
        const playerPlatformH = 260;
        const playerY = 490;
        this.leftPlatform = new RooftopPlatform(this.engine, 80, playerY, playerPlatformW, playerPlatformH);

        // Single Player instance (created once)
        this.player = new ShinobiRagdoll(this.engine, 220, playerY - 32, true, { health: 100 });

        // Platform 2: Right Platform (Opponent Rooftop)
        const enemyX = 760;
        const enemyPlatformW = 260;
        this.rightPlatform = new RooftopPlatform(this.engine, enemyX, playerY, enemyPlatformW, 300);

        this.platforms = [this.leftPlatform, this.rightPlatform];

        // Single Enemy instance
        this.enemy = new ShinobiRagdoll(this.engine, enemyX + 80, playerY - 32, false, {
          health: 70,
          isArmored: false
        });
        this.enemies = [this.enemy];

        this.resetEnemyTimer();
        this.gameState = 'PLAYING';
      }

      resetEnemyTimer() {
        // Relaxed rhythm: 3.2s to 3.8s total cycle (2.2s idle + 0.8s windup + 0.2s throw + 0.5s rest)
        this.enemyAimTimer = 3200 + Math.random() * 600;
      }

      onShurikenHit(shuriken, targetBody, forceHeadshot = false) {
        if (!shuriken || shuriken.isStuck) return;
        const ragdoll = targetBody.ragdollOwner;
        if (!ragdoll || ragdoll.isDead) return;

        if (shuriken.isPlayer && !ragdoll.isPlayer) {
          const isHeadshot = forceHeadshot || targetBody.label === 'enemy_head' || targetBody === ragdoll.head || targetBody.isHead;
          const damage = isHeadshot ? 999 : (targetBody.label === 'enemy_torso' ? 45 : 30);

          const hitVx = shuriken.body.velocity.x * 0.003;
          const hitVy = shuriken.body.velocity.y * 0.003 - 0.01;

          const res = ragdoll.applyHit(damage, targetBody, { x: hitVx, y: hitVy }, isHeadshot);
          shuriken.stickTo(targetBody);

          // Sparks & HP-Scaled Blood
          this.particles.spawnImpactSparks(shuriken.body.position.x, shuriken.body.position.y, isHeadshot ? 38 : 16, isHeadshot);
          const remainingHpPct = Math.max(0, ragdoll.health / ragdoll.maxHealth);
          this.particles.spawnBlood(
            shuriken.body.position.x,
            shuriken.body.position.y,
            shuriken.body.velocity.x,
            shuriken.body.velocity.y,
            remainingHpPct,
            isHeadshot || res.defeated
          );
          this.sounds.playHit(isHeadshot);

          if (isHeadshot) {
            this.headshots++;
            this.goldCoins += 25;
            this.sounds.playCoin();
            this.addPopup(targetBody.position.x, targetBody.position.y - 30, 'CRITICAL / HEADSHOT!', '#fbbf24', true);
            this.addPopup(targetBody.position.x, targetBody.position.y - 58, '+25 COINS', '#f59e0b');
          } else {
            this.addPopup(targetBody.position.x, targetBody.position.y - 25, `-${damage}`, '#f43f5e');
            if (res.defeated) {
              this.goldCoins += 10;
              this.sounds.playCoin();
              this.addPopup(targetBody.position.x, targetBody.position.y - 50, '+10 COINS', '#f59e0b');
            }
          }

          if (res.defeated) {
            this.triggerEncounterVictory();
          }
        }
      }

      handleCollisions(event) {
        const pairs = event.pairs;
        for (let pair of pairs) {
          const bodyA = pair.bodyA;
          const bodyB = pair.bodyB;

          const shurikenBody = bodyA.shurikenRef ? bodyA : (bodyB.shurikenRef ? bodyB : null);
          const targetBody = bodyA === shurikenBody ? bodyB : bodyA;

          if (shurikenBody && targetBody) {
            const shuriken = shurikenBody.shurikenRef;
            if (shuriken.isStuck) continue;

            const ragdoll = targetBody.ragdollOwner;

            // Player Shuriken hitting Enemy
            if (shuriken.isPlayer && ragdoll && !ragdoll.isPlayer && !ragdoll.isDead) {
              const isHeadshot = targetBody.label === 'enemy_head' || targetBody === ragdoll.head || targetBody.isHead;
              this.onShurikenHit(shuriken, targetBody, isHeadshot);
            }

            // Enemy Shuriken hitting Player (Aimed at torso/body only - NO HEADSHOTS ON PLAYER)
            if (!shuriken.isPlayer && ragdoll && ragdoll.isPlayer && !ragdoll.isDead) {
              const damage = 25; // Balanced body damage only

              this.timeSinceLastDamage = 0;
              const hitVx = shurikenBody.velocity.x * 0.003;
              const hitVy = shurikenBody.velocity.y * 0.003 - 0.01;

              ragdoll.applyHit(damage, targetBody, { x: hitVx, y: hitVy }, false);
              shuriken.stickTo(targetBody);

              this.particles.spawnImpactSparks(shurikenBody.position.x, shurikenBody.position.y, 16, false);
              const remainingPlayerHpPct = Math.max(0, ragdoll.health / ragdoll.maxHealth);
              this.particles.spawnBlood(
                shurikenBody.position.x,
                shurikenBody.position.y,
                shurikenBody.velocity.x,
                shurikenBody.velocity.y,
                remainingPlayerHpPct,
                ragdoll.isDead
              );
              this.sounds.playHit(false);
              this.addPopup(targetBody.position.x, targetBody.position.y - 25, `-${damage}`, '#ef4444');

              if (ragdoll.isDead) {
                this.triggerGameOver();
              }
            }

            // Shuriken hitting Rooftop Platform
            if (targetBody.label === 'platform') {
              if (!shuriken.isStuck && !shuriken.isGroundStuck) {
                shuriken.isGroundStuck = true;
                shuriken.isStuck = true;
                shuriken.groundStuckTimer = 2500;
                Matter.Body.setVelocity(shuriken.body, { x: 0, y: 0 });
                Matter.Body.setAngularVelocity(shuriken.body, 0);
                this.particles.spawnImpactSparks(shurikenBody.position.x, shurikenBody.position.y, 8, false);
              }
            }
          }
        }
      }

      triggerEncounterVictory() {
        if (this.isTransitioning) return; // TRIGGER ONCE LOCK!
        this.isTransitioning = true;
        this.kills++;

        // Allow 650ms for enemy to collapse backward and lie flat on the rooftop floor!
        setTimeout(() => {
          if (this.gameState === 'PLAYING') {
            this.startTransitionJump();
          }
        }, 650);
      }

      startTransitionJump() {
        // Clear all active flying shurikens
        for (let p of this.projectiles) p.destroy();
        this.projectiles = [];

        // Athletic Jump to Right Platform
        this.transitionPhase = 'JUMP';
        this.transitionTimer = 0;
        this.jumpDuration = 700;

        this.jumpStartX = this.player.torso.position.x;
        this.jumpStartY = this.player.torso.position.y;
        this.jumpTargetX = this.rightPlatform.x + 80;
        this.jumpTargetY = this.rightPlatform.y - 32;

        this.player.isJumping = true;
        this.player.isWalking = false;
        this.sounds.playDash();
      }

      completeWorldShiftAndSpawnNext() {
        // 1. Destroy old left platform and dead enemy behind player
        if (this.leftPlatform) {
          this.leftPlatform.destroy();
        }
        if (this.enemy) {
          this.enemy.destroy();
          this.enemy = null;
          this.enemies = [];
        }

        // 2. The right platform where player just landed becomes the left platform!
        this.leftPlatform = this.rightPlatform;

        // Ensure Player Health & HUD persistence across transitions
        if (isNaN(this.player.health) || this.player.health <= 0) {
          this.player.health = Math.max(1, this.player.health || 100);
        }
        this.player.maxHealth = 100;
        this.player.hp = this.player.health;
        this.player.maxHp = 100;

        // 3. Spawn fresh NEW right platform ahead
        const distanceTier = this.distanceMeters;
        const gap = 380 + Math.min(distanceTier * 0.35, 140) + (Math.random() * 40 - 20);
        const enemyX = this.leftPlatform.x + this.leftPlatform.width + gap;

        // Variable elevation (+/- 60px)
        const elevOffset = distanceTier > 80 ? (Math.random() - 0.5) * Math.min(distanceTier * 0.3, 100) : 0;
        const enemyPlatformY = Math.min(540, Math.max(400, 490 + elevOffset));
        const enemyPlatformW = 260;
        this.rightPlatform = new RooftopPlatform(this.engine, enemyX, enemyPlatformY, enemyPlatformW, 300);

        this.platforms = [this.leftPlatform, this.rightPlatform];

        // 4. Spawn single fresh new enemy perched on right platform
        const isArmored = distanceTier >= 200 && Math.random() > 0.45;
        const enemyHealth = distanceTier > 300 ? 110 : (distanceTier > 120 ? 90 : 70);
        this.enemy = new ShinobiRagdoll(this.engine, enemyX + 80, enemyPlatformY - 32, false, {
          health: enemyHealth,
          isArmored: isArmored
        });
        this.enemies = [this.enemy];

        // 5. Increment Distance meter (+40m to +50m)
        const distGain = 40 + Math.floor(Math.random() * 11);
        this.distanceMeters += distGain;
        if (this.distanceMeters > this.bestDistance) {
          this.bestDistance = this.distanceMeters;
          localStorage.setItem('rooftop_shinobi_best', this.bestDistance.toString());
        }

        // 6. Camera smooth target: frame the player on their new platform
        this.targetCameraX = this.leftPlatform.x - 80;

        // 7. Reset transition locks & resume aiming controls
        this.isTransitioning = false;
        this.transitionPhase = 'NONE';
        this.resetEnemyTimer();
      }
      triggerGameOver() {
        if (this.gameState === 'GAME_OVER') return;
        this.gameState = 'GAME_OVER';
        this.sounds.playDefeat();

        if (this.distanceMeters > this.bestDistance) {
          this.bestDistance = this.distanceMeters;
          localStorage.setItem('rooftop_shinobi_best', this.bestDistance.toString());
        }
      }

      addPopup(x, y, text, color = '#ff2a4d', isCrit = false) {
        this.popups.push({
          x: x,
          y: y,
          text: text,
          color: color,
          isCrit: isCrit,
          alpha: 1.0,
          scale: isCrit ? 1.4 : 1.0,
          vy: -1.4
        });
      }

      updateAI(delta) {
        if (this.gameState !== 'PLAYING' || this.isTransitioning || !this.player || this.player.isDead || !this.enemy || this.enemy.isDead) {
          return;
        }

        this.enemyAimTimer -= delta;

        // Relaxed Enemy Rhythm (3.2s - 3.8s cycle):
        // - Idle / Aim Pause (approx 2.2s - 2.8s): while enemyAimTimer > 1000ms, enemy rests naturally
        // - Windup Charge Animation (0.8s): while enemyAimTimer is between 1000ms and 200ms
        // - Throw Hold: 200ms before release
        const windupStart = 1000;
        const windupEnd = 200;
        if (this.enemyAimTimer <= windupStart && this.enemyAimTimer > windupEnd) {
          this.enemy.isAiming = true;
          this.enemy.aimPullProgress = (windupStart - this.enemyAimTimer) / (windupStart - windupEnd);
        } else if (this.enemyAimTimer <= windupEnd && this.enemyAimTimer > 0) {
          this.enemy.isAiming = true;
          this.enemy.aimPullProgress = 1.0;
        } else {
          this.enemy.isAiming = false;
        }

        if (this.enemyAimTimer <= 0) {
          this.enemy.isAiming = false;

          // 1-OUT-OF-5 ACCURACY RULE (80% DELIBERATE MISSES)
          this.enemyShotCount = (this.enemyShotCount || 0) + 1;
          const shotCycle = (this.enemyShotCount - 1) % 5;
          const isAccurate = (shotCycle === 0); // Only Shot 1 in every 5 is accurate

          const startX = this.enemy.torso.position.x - 20;
          const startY = this.enemy.torso.position.y - 10;

          // 1. FORCE LOWER TARGETING: Aim strictly at LOWER BODY / WAIST (ABSOLUTELY NO HEADSHOTS)
          const targetX = this.player.torso.position.x;
          const targetY = this.player.torso.position.y + 35; // Lower body / waist (well below head)

          const dx = targetX - startX;
          const dy = targetY - startY;

          const gravity = 0.32;
          const flightSteps = 36;

          let vx = dx / flightSteps;
          let vy = (dy - 0.5 * gravity * flightSteps * flightSteps) / flightSteps;

          if (isAccurate) {
            // Trajectory Head-Intersection Safety: Verify flight path does not clip head hitbox
            const headX = this.player.head.position.x;
            const headY = this.player.head.position.y;
            let nearHead = false;
            for (let step = 0; step <= flightSteps; step++) {
              const px = startX + vx * step;
              const py = startY + vy * step + 0.5 * gravity * step * step;
              if (Math.hypot(px - headX, py - headY) < 24) {
                nearHead = true;
                break;
              }
            }
            if (nearHead) {
              // Automatically clamp/reduce launch power and drop trajectory safely into lower torso
              vy += 0.85;
              vx *= 0.94;
            }
          } else {
            // 80% Deliberate Misses (Shots 2, 3, 4, 5)
            if (shotCycle === 1) {
              // Shot 2: Intentional Overhead Miss (+14 deg loft / +22% power)
              vx *= 1.22;
              vy *= 1.15;
            } else if (shotCycle === 2) {
              // Shot 3: Intentional Undershoot onto platform in front of player (-25% power)
              vx *= 0.75;
              vy *= 0.82;
            } else if (shotCycle === 3) {
              // Shot 4: Intentional Short Drop into gap (-35% power)
              vx *= 0.65;
              vy *= 0.76;
            } else {
              // Shot 5: High Arching Miss (+14 deg loft, drops harmlessly short)
              vx *= 0.85;
              vy -= 1.8;
            }
          }

          const throwAngle = Math.atan2(vy, vx);
          this.enemy.triggerThrow(throwAngle);

          const shuriken = new Shuriken(this.engine, startX, startY, vx, vy, false, this);
          this.projectiles.push(shuriken);
          this.sounds.playThrow();

          this.resetEnemyTimer();
        }
      }

      gameLoop(currentTime) {
        if (!this.lastTime) this.lastTime = currentTime;
        const delta = Math.max(0, Math.min(currentTime - this.lastTime, 40));
        this.lastTime = currentTime;

        // 1. Physics Step
        Matter.Engine.update(this.engine, delta);

        // 2. Transition Progression (Athletic Leap with Smooth Camera Lerp)
        if (this.isTransitioning && this.player && !this.player.isDead) {
          if (this.transitionPhase === 'JUMP') {
            this.transitionTimer += delta;
            const t = Math.min(1.0, this.transitionTimer / this.jumpDuration);

            const currX = this.jumpStartX + (this.jumpTargetX - this.jumpStartX) * t;
            const baseY = this.jumpStartY + (this.jumpTargetY - this.jumpStartY) * t;
            const arcApex = 95;
            const currY = baseY - Math.sin(t * Math.PI) * arcApex;

            this.player.setPosition(currX, currY);

            // Dynamic athletic physics tilt to player body during jump
            const jumpTilt = Math.sin(t * Math.PI) * 0.28;
            Matter.Body.setAngle(this.player.torso, jumpTilt);

            // Camera smoothly lerps tracking player jump: cameraX += (target - cameraX) * 0.08
            this.targetCameraX = Math.max(0, currX - 220);
            this.cameraX += (this.targetCameraX - this.cameraX) * 0.08;

            if (t >= 1.0) {
              this.player.isJumping = false;
              Matter.Body.setAngle(this.player.torso, 0);
              this.player.landingTimer = 180;
              this.particles.spawnDustPuff(this.jumpTargetX - 10, this.jumpTargetY + 34, 14);
              this.particles.spawnDustPuff(this.jumpTargetX + 10, this.jumpTargetY + 34, 14);

              // Seamlessly spawn next platform without screen flicker
              this.completeWorldShiftAndSpawnNext();
            }
          }
        } else if (this.player && !this.player.isDead) {
          // Smooth continuous camera lerp tracking player perch
          this.targetCameraX = Math.max(0, this.player.torso.position.x - 220);
          this.cameraX += (this.targetCameraX - this.cameraX) * 0.08;
        }

        // 3. Stamina Regeneration (Reduced by ~60% to +0.30 per frame / ~18 per second)
        if (this.gameState === 'PLAYING') {
          if (!this.isAiming) {
            const staminaGain = (delta / 16.66) * 0.30;
            this.playerStamina = Math.min(this.maxStamina, this.playerStamina + staminaGain);
          }

          this.timeSinceLastDamage += delta;
          if (this.timeSinceLastDamage > 2500 && this.player && !this.player.isDead && this.player.health < this.player.maxHealth) {
            this.player.health = Math.min(this.player.maxHealth, this.player.health + (delta / 1000) * 5.0);
            if (Math.random() < 0.22) {
              this.particles.spawnHealingSparkles(this.player.torso.position.x, this.player.torso.position.y);
            }
          }
        }

        // 4. Update Entities
        if (this.player) {
          if (this.isAiming && !this.isTransitioning && !this.player.isDead) {
            this.player.isAiming = true;
          }
          this.player.update(currentTime, delta);
          if (this.player.torso.position.y > 660 && !this.player.isDead) {
            this.player.health = 0;
            this.player.triggerRagdollDefeat();
            this.triggerGameOver();
          }
        }

        if (this.enemy) {
          this.enemy.update(currentTime, delta);
          if (this.enemy.torso.position.y > 650 && !this.enemy.isDead) {
            this.enemy.health = 0;
            this.enemy.triggerRagdollDefeat();
            this.addPopup(this.enemy.torso.position.x, 600, 'FALLEN!', '#f43f5e');
            this.goldCoins += 15;
            this.sounds.playCoin();
            this.triggerEncounterVictory();
          }
        }

        // Update Projectiles
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          p.update(currentTime, delta);
          if (p.isMarkedForRemoval || p.body.position.y > 800 || p.body.position.x < this.cameraX - 400 || p.body.position.x > this.cameraX + 1800) {
            p.destroy();
            this.projectiles.splice(i, 1);
          }
        }

        // Update AI
        this.updateAI(delta);

        // Update Particles
        this.particles.update(this.platforms);

        // Update Popups
        for (let i = this.popups.length - 1; i >= 0; i--) {
          const pop = this.popups[i];
          pop.y += pop.vy;
          pop.alpha -= 0.022;
          if (pop.alpha <= 0) {
            this.popups.splice(i, 1);
          }
        }

        // 5. Render
        this.render();

        requestAnimationFrame((t) => this.gameLoop(t));
      }

      render() {
        const ctx = this.ctx;
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        ctx.save();
        ctx.translate(this.offsetX, this.offsetY);
        ctx.scale(this.scaleRatio, this.scaleRatio);

        ctx.beginPath();
        ctx.rect(0, 0, this.virtualW, this.virtualH);
        ctx.clip();

        // 1. Parallax Japanese Sky & Moon (Screen Space)
        this.renderBackground(ctx);

        // 2. Distant Midground Rooftop Silhouettes (Screen Space Parallax)
        this.renderMidgroundParallax(ctx);

        // Camera Offset Matrix for World Space
        ctx.save();
        ctx.translate(-this.cameraX, 0);

        // 3. Main Rooftops & Platforms
        for (let plat of this.platforms) {
          plat.render(ctx);
        }

        // 4. Ragdoll Characters
        if (this.player) this.player.render(ctx);

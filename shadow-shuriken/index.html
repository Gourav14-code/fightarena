        if (this.enemy) this.enemy.render(ctx);

        // 5. Shurikens
        for (let p of this.projectiles) p.render(ctx);

        // 6. Ballistic Aim Trajectory Arc (Player only, not during transition)
        if (this.isAiming && !this.isTransitioning && this.player && !this.player.isDead) {
          this.renderAimTrajectory(ctx);
        }

        // 7. Floating Combat Popups
        for (let pop of this.popups) {
          ctx.save();
          ctx.font = pop.isCrit ? '900 24px "Cinzel", serif' : 'bold 20px "Cinzel", serif';
          ctx.fillStyle = pop.color;
          ctx.globalAlpha = Math.max(0, pop.alpha);
          ctx.shadowColor = pop.color;
          ctx.shadowBlur = 12;
          ctx.textAlign = 'center';
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.restore();
        }

        // 8. World Space Combat Particles
        this.particles.renderWorld(ctx);

        ctx.restore(); // Restore Camera

        // 9. Foreground Sakura Petals (Screen Space)
        this.particles.renderScreen(ctx);

        // 10. Minimalist Shinobi HUD
        this.renderHUD(ctx);

        // 11. Screen Overlays
        if (this.gameState === 'START') {
          this.renderStartScreen(ctx);
        } else if (this.gameState === 'GAME_OVER') {
          this.renderGameOverScreen(ctx);
        }

        ctx.restore();
      }

      renderBackground(ctx) {
        const skyGrad = ctx.createLinearGradient(0, 0, 0, this.virtualH);
        skyGrad.addColorStop(0, '#0a0314');
        skyGrad.addColorStop(0.45, '#1b092b');
        skyGrad.addColorStop(0.85, '#2e1245');
        skyGrad.addColorStop(1, '#180826');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, this.virtualW, this.virtualH);

        const moonX = this.virtualW * 0.76;
        const moonY = 160;
        const moonRadius = 64;

        const haloGrad = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.8, moonX, moonY, moonRadius * 2.8);
        haloGrad.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
        haloGrad.addColorStop(0.5, 'rgba(216, 180, 254, 0.12)');
        haloGrad.addColorStop(1, 'rgba(10, 3, 20, 0)');
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius * 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fef3c7';
        ctx.shadowColor = '#fef08a';
        ctx.shadowBlur = 24;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(217, 119, 6, 0.12)';
        ctx.beginPath();
        ctx.arc(moonX - 16, moonY - 14, 14, 0, Math.PI * 2);
        ctx.arc(moonX + 22, moonY + 12, 18, 0, Math.PI * 2);
        ctx.arc(moonX - 8, moonY + 24, 11, 0, Math.PI * 2);
        ctx.fill();
      }

      renderMidgroundParallax(ctx) {
        const pX1 = this.cameraX * 0.22;
        ctx.fillStyle = '#100a1c';
        const startI1 = Math.floor(pX1 / 360) - 1;
        for (let i = startI1; i < startI1 + 7; i++) {
          const spireX = i * 360 - pX1;
          this.drawPagodaSpire(ctx, spireX, 320, 70, 240);
        }

        const pX2 = this.cameraX * 0.45;
        ctx.fillStyle = '#150f24';
        const startI2 = Math.floor(pX2 / 290) - 1;
        for (let i = startI2; i < startI2 + 8; i++) {
          const spireX = i * 290 - pX2;
          this.drawPagodaSpire(ctx, spireX, 420, 90, 200);
        }
      }

      drawPagodaSpire(ctx, x, y, w, h) {
        ctx.beginPath();
        for (let tier = 0; tier < 3; tier++) {
          const tierY = y + tier * (h / 3.4);
          const tierW = w * (1 - tier * 0.16);
          ctx.moveTo(x - tierW * 0.6, tierY + 18);
          ctx.quadraticCurveTo(x, tierY + 4, x + tierW * 0.6, tierY + 18);
          ctx.lineTo(x + tierW * 0.35, tierY + 34);
          ctx.lineTo(x - tierW * 0.35, tierY + 34);
        }
        ctx.fill();
      }

      renderAimTrajectory(ctx) {
        const aim = this.getAimLaunchVector();
        if (!aim) return;

        const gravity = 0.32;
        const totalSteps = 28;

        ctx.save();
        for (let t = 0; t < totalSteps; t++) {
          const px = aim.startX + aim.vx * t;
          const py = aim.startY + aim.vy * t + 0.5 * gravity * t * t;

          const dotRadius = Math.max(1.8, 4.5 - t * 0.12);
          const alpha = Math.max(0.15, 1.0 - t * 0.035);

          ctx.beginPath();
          ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
          ctx.fillStyle = this.playerStamina < 25 ? `rgba(245, 158, 11, ${alpha})` : `rgba(255, 42, 77, ${alpha})`;
          ctx.shadowColor = this.playerStamina < 25 ? '#f59e0b' : '#ff2a4d';
          ctx.shadowBlur = 8;
          ctx.fill();
        }
        ctx.restore();
      }

      renderHUD(ctx) {
        ctx.save();
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;

        // 1. Top-Center: Large Distance Display
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.font = '900 36px "Cinzel", serif';
        ctx.shadowColor = 'rgba(255, 42, 77, 0.6)';
        ctx.shadowBlur = 12;
        ctx.fillText(`${this.distanceMeters} m`, this.virtualW / 2, 48);

        ctx.font = 'bold 14px "Cinzel", serif';
        ctx.fillStyle = '#94a3b8';
        ctx.shadowBlur = 0;
        ctx.fillText(`BEST: ${this.bestDistance} m`, this.virtualW / 2, 72);

        // 2. Top-Right: Gold Coins Counter
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 22px "Cinzel", serif';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.fillText(`🪙 ${this.goldCoins}`, this.virtualW - 32, 48);

        // 3. Top-Left: Player Health & Stamina HUD Card (Always Guaranteed Visible & Persistent)
        if (this.player) {
          const maxHp = Number(this.player.maxHealth || this.player.maxHp || 100);
          const rawHp = this.player.health !== undefined ? this.player.health : (this.player.hp !== undefined ? this.player.hp : maxHp);
          const currHp = isNaN(rawHp) ? maxHp : Math.max(0, Math.min(maxHp, rawHp));
          const hpPct = Math.max(0, Math.min(1, currHp / maxHp));

          const rawStam = this.playerStamina !== undefined ? this.playerStamina : 100;
          const maxStam = Number(this.maxStamina || 100);
          const currStam = isNaN(rawStam) ? maxStam : Math.max(0, Math.min(maxStam, rawStam));
          const stamPct = Math.max(0, Math.min(1, currStam / maxStam));

          const barW = 175;
          const barX = 28;

          // HUD Card Semi-Transparent Background for 100% Contrast & Legibility
          ctx.fillStyle = 'rgba(8, 6, 14, 0.82)';
          ctx.strokeStyle = 'rgba(51, 65, 85, 0.75)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(barX - 10, 16, barW + 20, 72, 8);
          ctx.fill();
          ctx.stroke();

          // Health Bar
          const hpBarH = 11;
          const hpBarY = 40;
          const isPassiveHealing = this.timeSinceLastDamage > 2500 && currHp < maxHp && !this.player.isDead;

          ctx.textAlign = 'left';
          // High-contrast bright teal / white text
          ctx.fillStyle = isPassiveHealing ? '#2dd4bf' : '#38bdf8';
          ctx.font = 'bold 12px "Cinzel", "Segoe UI", sans-serif';
          ctx.shadowBlur = 0;
          ctx.fillText(isPassiveHealing ? 'SHINOBI HP (+HEAL)' : 'SHINOBI HP', barX, hpBarY - 6);

          ctx.textAlign = 'right';
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(`${Math.ceil(currHp)}/${maxHp}`, barX + barW, hpBarY - 6);

          // Track
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(barX, hpBarY, barW, hpBarH);
          // Fill
          ctx.fillStyle = hpPct > 0.25 ? '#10b981' : '#ef4444';
          ctx.fillRect(barX, hpBarY, barW * hpPct, hpBarH);
          // Border
          ctx.strokeStyle = isPassiveHealing ? '#2dd4bf' : (hpPct > 0.25 ? '#059669' : '#dc2626');
          ctx.lineWidth = 1.5;
          ctx.strokeRect(barX, hpBarY, barW, hpBarH);

          // Stamina Bar
          const stamBarH = 7;
          const stamBarY = 67;
          const isFatigued = currStam < 25;

          ctx.textAlign = 'left';
          ctx.fillStyle = isFatigued ? '#f59e0b' : '#94a3b8';
          ctx.font = 'bold 11px "Cinzel", "Segoe UI", sans-serif';
          ctx.fillText(isFatigued ? 'STAMINA (FATIGUE)' : 'STAMINA', barX, stamBarY - 4);

          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(barX, stamBarY, barW, stamBarH);
          ctx.fillStyle = isFatigued ? '#f59e0b' : '#38bdf8';
          ctx.fillRect(barX, stamBarY, barW * stamPct, stamBarH);
          ctx.strokeStyle = isFatigued ? '#b45309' : '#0284c7';
          ctx.lineWidth = 1;
          ctx.strokeRect(barX, stamBarY, barW, stamBarH);
        }

        ctx.restore();
      }

      renderStartScreen(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(8, 6, 12, 0.78)';
        ctx.fillRect(0, 0, this.virtualW, this.virtualH);

        ctx.textAlign = 'center';

        ctx.fillStyle = '#f8fafc';
        ctx.font = '900 48px "Cinzel", serif';
        ctx.shadowColor = '#ff2a4d';
        ctx.shadowBlur = 20;
        ctx.fillText('SHADOW SHURIKEN', this.virtualW / 2, this.virtualH / 2 - 70);

        ctx.fillStyle = '#ff2a4d';
        ctx.font = 'bold 24px "Cinzel", serif';
        ctx.shadowBlur = 10;
        ctx.fillText('ROOFTOP SHINOBI', this.virtualW / 2, this.virtualH / 2 - 25);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '16px "Cinzel", serif';
        ctx.shadowBlur = 0;
        ctx.fillText('🏹 DRAG BACKWARD TO AIM & RELEASE SHURIKEN', this.virtualW / 2, this.virtualH / 2 + 35);
        ctx.fillText('💀 HEADSHOTS DEAL INSTANT CRITICAL KO & DOUBLE COINS', this.virtualW / 2, this.virtualH / 2 + 65);

        const pulse = Math.abs(Math.sin(Date.now() * 0.005));
        ctx.fillStyle = `rgba(251, 191, 36, ${0.7 + pulse * 0.3})`;
        ctx.font = 'bold 22px "Cinzel", serif';
        ctx.fillText('— TAP / CLICK TO COMMENCE DUEL —', this.virtualW / 2, this.virtualH / 2 + 130);

        ctx.restore();
      }

      renderGameOverScreen(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(8, 6, 12, 0.88)';
        ctx.fillRect(0, 0, this.virtualW, this.virtualH);

        ctx.textAlign = 'center';

        ctx.fillStyle = '#ef4444';
        ctx.font = '900 50px "Cinzel", serif';
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 24;
        ctx.fillText('SHADOW FALLEN', this.virtualW / 2, this.virtualH / 2 - 110);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 22px "Cinzel", serif';
        ctx.shadowBlur = 0;
        ctx.fillText(`DISTANCE SURVIVED: ${this.distanceMeters} m`, this.virtualW / 2, this.virtualH / 2 - 40);

        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 18px "Cinzel", serif';
        ctx.fillText(`BEST RECORD: ${this.bestDistance} m`, this.virtualW / 2, this.virtualH / 2 - 10);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '17px "Cinzel", serif';
        ctx.fillText(`Enemies Vanquished: ${this.kills}  |  Critical Headshots: ${this.headshots}  |  Coins: ${this.goldCoins}`, this.virtualW / 2, this.virtualH / 2 + 25);

        const btnW = 220, btnH = 55;
        const btnX = this.virtualW / 2 - btnW / 2;
        const btnY = this.virtualH / 2 + 85;

        ctx.fillStyle = '#ff2a4d';
        ctx.shadowColor = '#ff2a4d';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 8);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 20px "Cinzel", serif';
        ctx.fillText('PLAY AGAIN', this.virtualW / 2, btnY + 35);

        ctx.restore();
      }
    }

    // Launch Game on window load or DOM ready
    function initGame() {
      if (!window.gameInstance) {
        window.gameInstance = new ShadowShurikenGame();
      }
    }
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initGame);
      window.addEventListener('load', initGame);
    } else {
      initGame();
    }

  })();
  </script>

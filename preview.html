<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Monster Knockout - Widescreen Survival Preview</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container"></div>

  <script src="assets/phaser.min.js"></script>
  <script src="src/systems/Trajectory.js"></script>
  <script src="src/entities/Projectile.js"></script>
  <script src="src/entities/Arrow.js"></script>
  <script src="src/entities/RagdollCreature.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>

  <script>
    class PreviewBootScene extends BootScene {
      create() {
        this.generateProceduralAssets();
        this.scene.start('GameScene', { previewAim: true });
      }
    }

    const previewConfig = {
      type: Phaser.AUTO,
      parent: 'game-container',
      previewAim: true,
      backgroundColor: '#040d18',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 720
      },
      physics: {
        default: 'matter',
        matter: {
          gravity: { y: 1.25 },
          debug: false
        }
      },
      scene: [PreviewBootScene, GameScene, UIScene]
    };

    window.previewGame = new Phaser.Game(previewConfig);

    window.addEventListener('load', () => {
      setTimeout(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const weaponParam = urlParams.get('weapon') || 'bow';
        const killsParam = parseInt(urlParams.get('kills') || '3', 10);

        const ui = previewGame.scene.getScene('UIScene');
        if (ui) {
          ui.kills = killsParam;
          if (ui.killsText) ui.killsText.setText('💀 KILLS: ' + killsParam);
          ui.selectWeaponClass(weaponParam);
        }

        for (let i = 0; i < 35; i++) {
          previewGame.step(performance.now(), 16.6);
        }

        const gs = previewGame.scene.getScene('GameScene');
        if (gs && gs.launchAnchor) {
          gs.isAiming = true;
          gs.updateAim({ x: gs.launchAnchor.x - 90, y: gs.launchAnchor.y + 40 });
        }
      }, 300);
    });
  </script>
</body>
</html>
